<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio Analítico Cuprum</title>
<meta name="description" content="Portafolio de Data Analytics de AFP Cuprum, navegable por pantallas: casos de uso, torre de control, roadmap y anexo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --ink:#14202B; --surface:#FFFFFF; --surface-2:#E7EAEF;
  --border:#D3DAE1; --muted:#55636E;
  --accent:#B5651D; --accent-ink:#FFFFFF;
  --accent-2:#3F8A7B; --accent-2-ink:#FFFFFF;
  --good:#2E7D46; --good-bg:#E4F3E8;
  --warn:#9A6400; --warn-bg:#FBEDD3;
  --critical:#B3261E; --critical-bg:#FBE4E1;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",-apple-system,Roboto,sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --measure:68ch;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101720; --ink:#E7EEF3; --surface:#161F29; --surface-2:#1E2A35;
    --border:#2B3A47; --muted:#9FB1BE;
    --accent:#E0964F; --accent-ink:#1A1206;
    --accent-2:#5FBBA9; --accent-2-ink:#08201C;
    --good:#63C77F; --good-bg:#123420;
    --warn:#E3AE45; --warn-bg:#3A2B0C;
    --critical:#E88680; --critical-bg:#3B1613;
  }
}
:root[data-theme="dark"]{
  --bg:#101720; --ink:#E7EEF3; --surface:#161F29; --surface-2:#1E2A35;
  --border:#2B3A47; --muted:#9FB1BE;
  --accent:#E0964F; --accent-ink:#1A1206;
  --accent-2:#5FBBA9; --accent-2-ink:#08201C;
  --good:#63C77F; --good-bg:#123420;
  --warn:#E3AE45; --warn-bg:#3A2B0C;
  --critical:#E88680; --critical-bg:#3B1613;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:16px; line-height:1.55; padding-inline:16px;
}
a{color:var(--accent);}
a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline:3px solid var(--accent-2); outline-offset:2px; border-radius:3px;
}
h1,h2,h3,h4{font-family:var(--font-display); line-height:1.15; letter-spacing:-0.01em;}
h1{font-size:clamp(1.7rem,4vw,2.6rem); margin:0 0 .3em;}
h2{font-size:clamp(1.3rem,3vw,1.7rem); margin:2.2em 0 .6em; padding-top:.2em; border-top:1px solid var(--border);}
h3{font-size:1.15rem; margin:1.6em 0 .5em;}
h4{font-size:1rem; margin:1.2em 0 .4em;}
p{margin:.6em 0;}
.mono, .kpi-num, .md-kpi-num, .num, table td.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.medida{max-width:var(--measure);}
.wrap{max-width:1180px; margin:0 auto;}
.layout{display:flex; gap:2.2rem; align-items:flex-start; padding-block:1.4rem 4rem;}
nav.indice{
  position:sticky; top:1rem; flex:0 0 220px; align-self:flex-start;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:.9rem .9rem; max-height:calc(100vh - 2rem); overflow-y:auto;
}
nav.indice h2{margin:0 0 .5em; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em;
  color:var(--muted); border:none; padding:0;}
nav.indice ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.15rem;}
nav.indice a{display:block; padding:.32rem .5rem; border-radius:6px; color:var(--ink); text-decoration:none; font-size:.9rem;}
nav.indice a:hover{background:var(--surface-2);}
main{flex:1 1 auto; min-width:0;}
section{margin-bottom:2.4rem;}
.badge{display:inline-block; font-family:var(--font-mono); font-size:.72rem; font-weight:600;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--border); border-radius:999px;
  padding:.15em .65em; margin-right:.5em;}
.badge-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.9rem; margin:1.2rem 0;}
.kpi-grid.cinco{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1rem 1.05rem;
  border-top:4px solid var(--accent);}
.kpi-num{font-size:1.7rem; font-weight:600; color:var(--accent); line-height:1.1;}
.kpi-label{margin-top:.35rem; font-size:.92rem;}
.kpi-sub{margin-top:.25rem; font-size:.78rem; color:var(--muted);}
.mensajes{list-style:none; margin:1rem 0; padding:0; display:grid; gap:.7rem;}
.mensajes li{background:var(--surface); border:1px solid var(--border); border-left:5px solid var(--accent-2);
  border-radius:8px; padding:.75rem .95rem;}
.chip{display:inline-flex; align-items:center; gap:.4em; font-size:.78rem; font-weight:600; padding:.2em .65em .22em;
  border-radius:999px; white-space:nowrap;}
.chip-dot{width:.5em; height:.5em; border-radius:50%; display:inline-block;}
.chip-ok{background:var(--good-bg); color:var(--good);}
.chip-ok .chip-dot{background:var(--good);}
.chip-warn, .chip-atención{background:var(--warn-bg); color:var(--warn);}
.chip-warn .chip-dot, .chip-atención .chip-dot{background:var(--warn);}
.chip-critical, .chip-critico{background:var(--critical-bg); color:var(--critical);}
.chip-critical .chip-dot, .chip-critico .chip-dot{background:var(--critical);}
.chip-info{background:var(--surface-2); color:var(--muted);}
.chip-info .chip-dot{background:var(--muted);}
.grid-cap{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.9rem; margin:1rem 0;}
.cap-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.9rem 1rem;}
.cap-card h4{margin:.1em 0 .3em; color:var(--accent-2);}
.proyecto{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.3rem 1.4rem 1.5rem;
  margin:1.3rem 0 2.1rem; scroll-margin-top:1rem;}
.proyecto.encurso{border-style:dashed; border-color:var(--accent-2);}
.proyecto-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:.6rem; margin-bottom:.2rem;}
.proyecto-head h3{margin:0;}
dl.campos{display:grid; grid-template-columns:max-content 1fr; gap:.35rem 1rem; margin:.7rem 0;}
dl.campos dt{font-weight:600; color:var(--muted); font-size:.85rem; padding-top:.15rem;}
dl.campos dd{margin:0;}
.reserva{background:var(--warn-bg); border:1px solid var(--warn); border-radius:10px; padding:.75rem .95rem; margin:1rem 0;}
.reserva-tag{display:inline-block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  color:var(--warn); margin-bottom:.3rem;}
.reserva p{margin:.2rem 0 0;}
.fuente-cita{font-size:.78rem; color:var(--muted); border-top:1px dashed var(--border); padding-top:.5rem; margin-top:1rem;}
.chart-wrap{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.8rem .9rem 1rem; margin:1rem 0;}
.chart-wrap figure{margin:0;}
.chart-wrap figcaption{font-size:.82rem; color:var(--muted); margin-top:.4rem;}
.mockup{border:1px solid var(--border); border-radius:12px; overflow:hidden; margin:1rem 0; background:var(--surface-2);}
.mockup-bar{display:flex; align-items:center; gap:.4rem; background:var(--surface); padding:.5rem .8rem; border-bottom:1px solid var(--border);}
.mockup-dot{width:9px; height:9px; border-radius:50%; background:var(--border);}
.mockup-title{margin-left:.5rem; font-size:.82rem; font-weight:600; color:var(--muted);}
.mockup-body{padding:.9rem;}
.md-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:.6rem; margin-bottom:.8rem;}
.md-kpi{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.55rem .6rem;}
.md-kpi-num{font-size:1.15rem; font-weight:600; color:var(--accent-2);}
.md-kpi-label{font-size:.74rem; color:var(--muted); margin-top:.15rem;}
.md-table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface);}
table.md-table, table.tabla{width:100%; border-collapse:collapse; font-size:.86rem;}
table.md-table th, table.md-table td, table.tabla th, table.tabla td{
  padding:.42rem .6rem; border-bottom:1px solid var(--border); text-align:left; vertical-align:top;}
table.md-table th, table.tabla th{font-size:.74rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
.stripe{display:inline-block; width:5px; height:.9em; margin-right:.5em; border-radius:2px; vertical-align:-1px;}
.stripe-ok{background:var(--good);} .stripe-warn{background:var(--warn);} .stripe-critical{background:var(--critical);}
tr.sev-critical td:first-child{font-weight:600;}
.md-chart{margin-top:.8rem;}
.tabla-wrap{overflow-x:auto; margin:1rem 0;}
.tabla th, .tabla td{white-space:normal;}
.roadmap{list-style:none; counter-reset:paso; margin:1rem 0; padding:0; display:grid; gap:.8rem;}
.roadmap li{position:relative; padding-left:2.6rem; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding-top:.7rem; padding-bottom:.75rem; padding-right:.9rem;}
.roadmap li::before{counter-increment:paso; content:counter(paso); position:absolute; left:.75rem; top:.65rem;
  width:1.5rem; height:1.5rem; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  font-family:var(--font-mono); font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center;}
.roadmap h4{margin:0 0 .25rem;}
.glosario dt{font-weight:700; font-family:var(--font-display); margin-top:.8rem;}
.glosario dd{margin:.15rem 0 0;}
footer.pie{color:var(--muted); font-size:.8rem; margin:2.5rem 0 1rem; padding-top:1rem; border-top:1px solid var(--border);}
@media (max-width: 880px){
  .layout{flex-direction:column; gap:1.1rem; align-items:stretch;}
  main{width:100%; max-width:100%;}
  nav.indice{position:static; flex:none; width:100%; max-height:none;}
  nav.indice ul{flex-direction:row; flex-wrap:wrap;}
  nav.indice a{font-size:.82rem; padding:.28rem .5rem;}
}
@media print{
  nav.indice{display:none;}
  .layout{display:block; padding:0;}
  body{padding-inline:0;}
  a{color:inherit; text-decoration:none;}
  .proyecto, .kpi-card, .mockup{break-inside:avoid;}
  .chart-wrap{break-inside:avoid;}
}

/* ===================== App shell (SPA) ===================== */
[hidden]{display:none!important;}
html, body{height:100%;}
body.app{margin:0; padding:0; overflow:hidden;}
.app-shell{position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg);}
.topbar{
  flex:0 0 auto; display:flex; align-items:stretch; gap:.7rem; flex-wrap:wrap;
  padding:.5rem .8rem; border-bottom:1px solid var(--border); background:var(--surface);
  min-width:0;
}
.topbar-title{font-family:var(--font-display); font-weight:700; font-size:1.05rem; white-space:nowrap; align-self:center;}
.topbar-chips{display:flex; gap:.35rem; flex-wrap:wrap; align-items:center; min-width:0;}
.topbar-chip{
  font-family:var(--font-body); font-size:.78rem; border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink); border-radius:999px; padding:.25em .7em; cursor:pointer;
}
.topbar-chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.topbar-search{margin-left:auto; min-width:0; flex:0 1 220px; align-self:center;}
.topbar-search input{
  width:100%; box-sizing:border-box; font-family:var(--font-body); font-size:.85rem;
  padding:.35em .7em; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--ink);
}
.app-body{flex:1 1 auto; min-height:0; display:flex; align-items:stretch; min-width:0;}
.navrail{
  flex:0 0 auto; width:96px; border-right:1px solid var(--border); background:var(--surface);
  display:flex; flex-direction:column; align-items:stretch; padding:.5rem .25rem; gap:.15rem; overflow-y:auto;
}
.navrail a{
  display:flex; flex-direction:column; align-items:center; gap:.15rem; padding:.5rem .2rem; border-radius:8px;
  color:var(--muted); text-decoration:none; font-size:.68rem; text-align:center; line-height:1.15;
}
.navrail a[aria-current="page"]{background:var(--surface-2); color:var(--accent); font-weight:600;}
.nav-dot{width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.55; align-self:center;}
#app-main{flex:1 1 auto; min-width:0; overflow-y:auto; padding:1.1rem 1rem 1.4rem;}
.tabbar{
  display:none; flex:0 0 auto; border-top:1px solid var(--border); background:var(--surface);
  align-items:stretch;
}
.tabbar a{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.1rem; padding:.4rem .1rem; color:var(--muted); text-decoration:none; font-size:.64rem; text-align:center;
}
.tabbar a[aria-current="page"]{color:var(--accent); font-weight:600;}
@media (max-width:880px){
  .navrail{display:none;}
  .tabbar{display:flex;}
  #app-main{padding-bottom:1.2rem;}
}
.screen h1{margin-top:.2rem;}
.screen h2{margin-top:1.6rem;}
.kpi-grid.cinco{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.kpi-spark{margin:.3rem 0;}
.accesos-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.8rem; margin:1rem 0;}
.acceso-card{
  display:flex; flex-direction:column; gap:.2rem; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:.8rem .9rem; text-decoration:none; color:var(--ink); min-width:0;
  border-left:4px solid var(--accent-2);
}
.acceso-area{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
.acceso-titulo{font-weight:600; font-size:.94rem;}
.acceso-metrica{font-size:.82rem; color:var(--accent);}
.cap-sub{font-size:.86rem; color:var(--muted); margin:0 0 .3rem;}
.cap-desc{font-size:.9rem; margin:0;}
#casos-toolbar{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin:.6rem 0 1rem;}
.grid-casos{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.9rem;}
.caso-card{
  display:flex; flex-direction:column; gap:.35rem; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:.9rem 1rem; text-decoration:none; color:var(--ink); min-width:0;
}
.caso-card:hover, .caso-card:focus-visible{border-color:var(--accent);}
.caso-card-head{display:flex; align-items:center; justify-content:space-between; gap:.4rem; flex-wrap:wrap;}
.caso-card h3{margin:0; font-size:1rem;}
.caso-card-area{font-size:.78rem; color:var(--muted); margin:0;}
.caso-card-metrica{font-size:.86rem; color:var(--accent); margin:0;}
.caso-card-reserva{font-size:.78rem; color:var(--muted); margin:0; border-top:1px dashed var(--border); padding-top:.35rem;}
#caso-detalle{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.9rem 1rem 1.2rem; min-width:0;}
.detalle-head{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; position:relative; padding-right:2.2rem;}
.detalle-head h3{margin:0; min-width:0;}
.btn-icon{
  position:absolute; top:-.2rem; right:-.2rem; width:2rem; height:2rem; border-radius:50%; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink); font-size:1.2rem; line-height:1; cursor:pointer;
}
.detalle-tabs{display:flex; gap:.3rem; flex-wrap:wrap; margin:.8rem 0; border-bottom:1px solid var(--border); padding-bottom:.5rem;}
.detalle-tab{
  font-family:var(--font-body); font-size:.82rem; padding:.35em .8em; border-radius:999px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink); cursor:pointer;
}
.detalle-tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.detalle-body{min-height:6rem; min-width:0;}
.detalle-nav{display:flex; justify-content:space-between; gap:.6rem; margin-top:1rem; flex-wrap:wrap;}
.btn-nav{
  font-size:.82rem; text-decoration:none; color:var(--ink); background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; padding:.4em .8em; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.torre-filtros{display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; margin:.7rem 0;}
.filtro-label{font-size:.78rem; color:var(--muted); margin-left:.4rem;}
.filtro-label:first-child{margin-left:0;}
.chip-filter{
  font-family:var(--font-body); font-size:.78rem; border:1px solid var(--border); background:var(--surface-2);
  color:var(--ink); border-radius:999px; padding:.2em .65em; cursor:pointer;
}
.chip-filter[aria-pressed="true"]{background:var(--accent-2); color:var(--accent-2-ink); border-color:var(--accent-2);}
#torre-sev{font-family:var(--font-body); font-size:.8rem; padding:.25em .5em; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink);}
.roadmap-pide{color:var(--muted); font-size:.86rem;}
table.sortable th{cursor:pointer; user-select:none; white-space:nowrap;}
table.sortable th[aria-sort]::after{content:""; display:inline-block; margin-left:.35em; width:0; height:0; vertical-align:middle;}
table.sortable th[aria-sort="ascending"]::after{border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:5px solid var(--accent);}
table.sortable th[aria-sort="descending"]::after{border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--accent);}
.buscador{
  width:100%; max-width:340px; box-sizing:border-box; font-family:var(--font-body); font-size:.9rem;
  padding:.4em .8em; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  margin:.6rem 0 1rem;
}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.001ms!important; animation-duration:.001ms!important;}
}
@media print{
  body.app{overflow:visible;}
  .app-shell{position:static; display:block;}
  .topbar, .navrail, .tabbar, .btn-icon, .detalle-tabs, .detalle-nav, #topbar-search, .torre-filtros, table.sortable th::after{display:none!important;}
  #app-main{overflow:visible; padding:0; height:auto;}
  .screen[hidden]{display:block!important;}
  #casos-grid, #caso-detalle{display:block!important;}
  .caso-card{break-inside:avoid; margin-bottom:.6rem;}
}
</style>
</head>
<body class="app">
<div class="app-shell">
  <header class="topbar">
    <span class="topbar-title">Portafolio Analítico Cuprum</span>
    <div class="topbar-chips" role="group" aria-label="Filtrar por área"><button class="topbar-chip" data-area="Comercial" aria-pressed="false">Comercial</button><button class="topbar-chip" data-area="Operaciones" aria-pressed="false">Operaciones</button><button class="topbar-chip" data-area="Riesgo" aria-pressed="false">Riesgo</button><button class="topbar-chip" data-area="Tesorería" aria-pressed="false">Tesorería</button><button class="topbar-chip" data-area="Normativa" aria-pressed="false">Normativa</button></div>
    <div class="topbar-search"><input type="search" id="topbar-search" placeholder="Buscar caso" aria-label="Buscar caso"></div>
  </header>
  <div class="app-body">
    <nav class="navrail" aria-label="Navegación principal"><a href="#/inicio" data-nav-screen="inicio"><span class="nav-dot" aria-hidden="true"></span>Inicio</a><a href="#/casos" data-nav-screen="casos"><span class="nav-dot" aria-hidden="true"></span>Casos</a><a href="#/torre-control" data-nav-screen="torre-control"><span class="nav-dot" aria-hidden="true"></span>Torre</a><a href="#/roadmap" data-nav-screen="roadmap"><span class="nav-dot" aria-hidden="true"></span>Roadmap</a><a href="#/datos-limites" data-nav-screen="datos-limites"><span class="nav-dot" aria-hidden="true"></span>Datos</a><a href="#/anexo" data-nav-screen="anexo"><span class="nav-dot" aria-hidden="true"></span>Anexo</a><a href="#/glosario" data-nav-screen="glosario"><span class="nav-dot" aria-hidden="true"></span>Glosario</a></nav>

t x=\"447.1\" y=\"79.3\" width=\"55.4\" height=\"126.7\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"474.8\" y=\"73.3\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">5.140</text><rect x=\"514.7\" y=\"146.1\" width=\"55.4\" height=\"59.9\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"542.4\" y=\"140.1\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">2.428</text><text x=\"514.7\" y=\"226.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">75 % se va</text><line x1=\"58\" y1=\"206.0\" x2=\"606\" y2=\"206.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Prioridad saldo×probabilidad</text><rect x=\"284.8\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"300.8\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Contacto aleatorio</text></svg><figcaption>Saldo retenido (MM CLP) con 30 % de capacidad de contacto sobre los sorteados de la licitación de 2027, según el supuesto de cuántos se van sin campaña (55 %/65 %/75 %) y cómo se prioriza. El sorteo elige al azar quién queda expuesto; a quién CONTACTAR dentro de ese grupo sí se puede elegir.</figcaption></figure></div>", "produccion_html": "Se necesita la tabla real de solicitudes de traspaso (SIAP/Previred), el historial de contactos del equipo comercial y las comisiones y rentabilidades publicadas de las seis AFP. Antes de producción: repetir la validación temporal con gap de 6 meses y exigir AUC ≥ 0,75 con datos reales (hoy el umbral del sandbox es 0,720). Riesgo regulatorio principal: la licitación de stock de la Ley 21.735 cambia las reglas de competencia cada dos años y debe gestionarse con presupuesto de contacto separado del churn voluntario.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>El saldo en riesgo esperado (probabilidad × saldo, agregado a nivel de cartera) no se entrega en esta ronda: el sesgo del pronóstico agregado va de -3,6 % a +40,2 % entre semillas, y es un problema de nivel del pronóstico, no de la calibración del modelo. El ranking para priorizar contactos sí es confiable; el número que se publicaría ('se van X mil millones el próximo semestre') todavía no lo es.</p></div>", "fuente_texto": "afp_lab/churn_traspaso/README.md §§1, 6, 7, 13.A, 13.B"}, {"id": "p03", "numero": "03", "nombre": "propension_apv", "titulo": "Ahorro previsional voluntario", "area": "Comercial", "estado_nivel": "ok", "estado_texto": "Aprobado (ronda 2)", "metrica_principal": "AUC 0,836", "reserva_corta": "No ordena bien al segmento VOLUNTARIO (2,2 % de la cartera elegible).", "problema_html": "¿A quién llama el ejecutivo este mes para abrir o reactivar un APV, y cuánto ahorro voluntario se puede proyectar para el semestre?", "resultado_html": "Contactando al 10 % de la cartera elegible ordenada por monto esperado se captura el 67,8 % del ahorro voluntario de adquisición, frente al 49,4 % que se captura hoy ordenando por renta (AUC 0,836 del modelo vs. 0,709 de la regla de negocio). El sesgo del monto esperado para toda la población es de 1,0 % en el agregado del semestre (WAPE 0,555 en los aportantes).", "uso_html": "La asesoría previsional prioriza la lista por monto esperado cuando la meta es CLP captados, y por probabilidad cuando la meta es número de cuentas nuevas. Cuprum es líder de mercado en APV, así que este modelo también sirve para defender aportantes frente al fondo mutuo o el seguro que compiten por el mismo ahorro.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Campaña de ahorro voluntario · propension_apv\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Campaña de ahorro voluntario · propension_apv</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">67,8 %</div><div class=\"md-kpi-label\">del ahorro de adquisición capturado</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">47,4 %</div><div class=\"md-kpi-label\">de los nuevos aportantes</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,836</div><div class=\"md-kpi-label\">AUC de test</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Reactivación con empresa APVC</td><td>aportó hace meses, empleador con match, renta alta</td><td class=\"num\">prob. alta, monto alto</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Segmento VOLUNTARIO</td><td>cotización errática, casi no aporta</td><td class=\"num\">excluir de la campaña</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Marzo/abril en finanzas y minería</td><td>bono anual coincide con el aporte esporádico</td><td class=\"num\">estacionalidad</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 560 220\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Captura de ahorro voluntario al 10 % de la cartera, modelo vs. orden por renta\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"176.0\" x2=\"546\" y2=\"176.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"180.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,0 %</text><line x1=\"58\" y1=\"142.0\" x2=\"546\" y2=\"142.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"146.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">21,7 %</text><line x1=\"58\" y1=\"108.0\" x2=\"546\" y2=\"108.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"112.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">43,4 %</text><line x1=\"58\" y1=\"74.0\" x2=\"546\" y2=\"74.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"78.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">65,1 %</text><line x1=\"58\" y1=\"40.0\" x2=\"546\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">86,8 %</text><rect x=\"89.7\" y=\"69.8\" width=\"148.1\" height=\"106.2\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"163.7\" y=\"63.8\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">67,8 %</text><text x=\"180.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Modelo (monto esperado)</text><rect x=\"333.7\" y=\"98.6\" width=\"148.1\" height=\"77.4\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"407.7\" y=\"92.6\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">49,4 %</text><text x=\"424.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Orden por renta (hoy)</text><line x1=\"58\" y1=\"176.0\" x2=\"546\" y2=\"176.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Captura al 10 %</text></svg><figcaption>Captura del 10 % de la cartera: modelo (monto esperado) vs. orden por renta.</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "Se necesita el historial real de aportes voluntarios, campañas y saldo voluntario, y la renta bruta declarada al SII (la renta imponible que hoy usa el modelo está topada, y subestima el tramo de impuesto de las rentas altas). Antes de producción: confirmar con la AFP si el aporte por planilla llega sin desfase, como se asumió, o con el mismo desfase que la cotización obligatoria.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>El modelo no ordena bien al segmento VOLUNTARIO (2,2 % de la cartera elegible): ahí la regla de negocio le gana. El protocolo de validación deja el entrenamiento tres a cuatro años antes del test, lo que es conservador (en producción, con reentrenamiento trimestral, la distancia real sería de doce meses), pero significa que estos números son un piso, no un techo.</p></div>", "fuente_texto": "afp_lab/propension_apv/README.md §§1, 6, 7, 8"}, {"id": "p04", "numero": "04", "nombre": "riesgo_cese_cotizacion", "titulo": "Cese y reingreso de cotización", "area": "Riesgo", "estado_nivel": "reserva", "estado_texto": "Corrección aprobada (ronda 4)", "metrica_principal": "AUC cese 0,887", "reserva_corta": "Reingreso en 0,608, bajo el umbral de 0,70; no se usa en producción.", "problema_html": "¿Quién dejará de cotizar en tres y seis meses, y quién de los que no cotizan hoy va a volver a hacerlo?", "resultado_html": "El modelo de cese llega a AUC 0,887 a tres meses y 0,878 a seis meses (baseline de regla de negocio: 0,798 a tres meses); contactando al 10 % de mayor riesgo se captura alrededor del 63,1 % de los ceses reales (medido antes de la última recalibración de densidad de cotización; ver reserva). El modelo de reingreso, en cambio, hoy da AUC 0,608, bajo el umbral de 0,70 del brief.", "uso_html": "El número esperado de ceses por mes alimenta el presupuesto de recaudación esperada; el 10 % de mayor riesgo de cese recibe asesoría proactiva &mdash; estas dos cabezas ya están disponibles. La cabeza de reingreso queda diseñada (la campaña útil no sería 'a quién va a reingresar', sino la cola de menor probabilidad, filtrada por años a la pensión) pero no se usa en producción todavía: ver la decisión en la reserva.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Alertas de cese y reingreso · riesgo_cese_cotizacion\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Alertas de cese y reingreso · riesgo_cese_cotizacion</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,887</div><div class=\"md-kpi-label\">AUC cese 3 m</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">63,1 %</div><div class=\"md-kpi-label\">ceses capturados al 10 %</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,608</div><div class=\"md-kpi-label\">AUC reingreso (bajo el umbral)</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-critical\"><td><span class=\"stripe stripe-critical\" aria-hidden=\"true\"></span>Reingreso poco predecible</td><td>AUC actual bajo el umbral del brief</td><td class=\"num\">0,608 &lt; 0,70</td><td><span class=\"chip chip-critico\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>crítico</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Cesantía en curso, sin señales de reingreso</td><td>término AFC reciente, cobertura de cesantía activa</td><td class=\"num\">prioridad de asesoría</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Cese a 3 y 6 meses</td><td>sigue por sobre el umbral del brief tras la recalibración</td><td class=\"num\">0,887 / 0,878</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 560 230\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"AUC del modelo de cese y reingreso, con la corrección posterior a la ronda 3 hecha en la ronda 4\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"186.0\" x2=\"546\" y2=\"186.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"190.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,000</text><line x1=\"58\" y1=\"149.5\" x2=\"546\" y2=\"149.5\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"153.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,284</text><line x1=\"58\" y1=\"113.0\" x2=\"546\" y2=\"113.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"117.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,568</text><line x1=\"58\" y1=\"76.5\" x2=\"546\" y2=\"76.5\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"80.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,852</text><line x1=\"58\" y1=\"40.0\" x2=\"546\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">1,135</text><rect x=\"79.1\" y=\"71.9\" width=\"98.7\" height=\"114.1\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"128.5\" y=\"65.9\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,887</text><text x=\"139.3\" y=\"206.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Cese 3 m</text><rect x=\"241.8\" y=\"73.1\" width=\"98.7\" height=\"112.9\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"291.2\" y=\"67.1\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,878</text><text x=\"302.0\" y=\"206.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Cese 6 m</text><rect x=\"404.5\" y=\"107.8\" width=\"98.7\" height=\"78.2\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"453.8\" y=\"101.8\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,608</text><text x=\"464.7\" y=\"206.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Reingreso</text><line x1=\"58\" y1=\"186.0\" x2=\"546\" y2=\"186.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">AUC modelo</text></svg><figcaption>AUC del modelo por objetivo, con la corrección posterior a la ronda 3 (ronda 4; perfil sistema, semilla 42).</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "Se necesita el feed real de eventos del Seguro de Cesantía (AFC) y de la planilla previsional con su desfase real de recepción. El modelo de cese está listo para un piloto de alertas de asesoría; el de reingreso necesita, primero, que el generador sintético distinga cesantía reciente de cesantía crónica antes de volver a intentarlo, y luego repetir la validación con datos reales.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>El AUC de reingreso cayó de 0,720 a 0,605 (sistema) cuando se recalibró la densidad de cotización del generador contra la Ficha 165 en la ronda 3. Una corrección posterior a la ronda 3, hecha en la ronda 4 (features del último empleo antes del cese), lo subió a 0,608 (+0,003 en la fila de referencia; rango +0,003 a +0,008, y un caso de -0,005), sin recuperar el umbral de 0,70. En palabras del propio informe, 'la dinámica actual del generador dejó el reingreso casi impredecible a nivel individual'. No es un problema de este modelo: es un límite del sandbox que hay que resolver en el generador antes de la próxima ronda. Nota adicional: la captura al 10 % de 63,1 % / 63,5 % y el baseline de regla de negocio (0,798) se midieron ANTES de esta recalibración de densidad y no se volvieron a medir después; se muestran igual, con esta salvedad explícita, porque el mecanismo de captura no cambió, solo la población. Decisión: la cabeza de reingreso no se usa en producción hasta ajustar el generador (probabilidad de contratación dependiente de la duración del cese) o validar con datos reales; las cabezas de cese a 3 y 6 meses sí quedan disponibles.</p></div>", "fuente_texto": "afp_lab/riesgo_cese_cotizacion/README.md §§1, 6, 7, 12"}, {"id": "p05", "numero": "05", "nombre": "riesgo_empleador", "titulo": "Riesgo de empleador (cobranza)", "area": "Riesgo", "estado_nivel": "reserva", "estado_texto": "Aprobado con reserva (ronda 3)", "metrica_principal": "AUC 0,865", "reserva_corta": "Captura al 10 % en 48,6 %, en el límite del criterio de 50 %.", "problema_html": "¿Qué empleadores van a declarar y no pagar, o van a pagar tarde este mes, y cuánta masa imponible de nuestros afiliados queda en riesgo?", "resultado_html": "Gestionando al 10 % de los empleadores (unos 1.000 en el universo de referencia) se cubre el 48,6 % de la masa imponible en riesgo en esta corrida &mdash; 51,9 % en promedio de cinco semillas &mdash; contra 44,1 % con la regla vigente (AUC 0,865 vs. 0,756). La precisión de la lista sube de 10,8 % a 21,9 %: una de cada cinco llamadas cae en un empleador que de verdad no va a pagar, contra una de cada nueve con la regla.", "uso_html": "Cobranza trabaja dos listas: la ordenada por probabilidad (para maximizar casos gestionados) y la ordenada por masa esperada (para maximizar CLP protegidos), según el canal disponible ese mes (masivo telefónico vs. ejecutivo dedicado).", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Cobranza previsional · riesgo_empleador\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Cobranza previsional · riesgo_empleador</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">48,6 %</div><div class=\"md-kpi-label\">masa en riesgo capturada al 10 %</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">21,9 %</div><div class=\"md-kpi-label\">precisión de la lista</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,865</div><div class=\"md-kpi-label\">AUC de test</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-critical\"><td><span class=\"stripe stripe-critical\" aria-hidden=\"true\"></span>Empleador con boletín de infractores</td><td>12 meses consecutivos de deuda</td><td class=\"num\">masa esperada alta</td><td><span class=\"chip chip-critico\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>crítico</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Segmento GRANDE</td><td>el modelo ya gana aquí, pero con muy pocos casos de DNP</td><td class=\"num\">vigilar, no reemplazar señales de respaldo</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Sector público</td><td>nunca cae en declaración y no pago</td><td class=\"num\">0 casos, fuera de la gestión</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 560 220\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Captura de masa imponible en riesgo al 10 % y al 20 % de los empleadores gestionados\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"176.0\" x2=\"546\" y2=\"176.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"180.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,0 %</text><line x1=\"58\" y1=\"142.0\" x2=\"546\" y2=\"142.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"146.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">22,7 %</text><line x1=\"58\" y1=\"108.0\" x2=\"546\" y2=\"108.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"112.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">45,4 %</text><line x1=\"58\" y1=\"74.0\" x2=\"546\" y2=\"74.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"78.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">68,1 %</text><line x1=\"58\" y1=\"40.0\" x2=\"546\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">90,8 %</text><rect x=\"89.7\" y=\"103.2\" width=\"148.1\" height=\"72.8\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"163.7\" y=\"97.2\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">48,6 %</text><text x=\"180.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">10 % (referencia)</text><rect x=\"333.7\" y=\"69.8\" width=\"148.1\" height=\"106.2\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"407.7\" y=\"63.8\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">70,9 %</text><text x=\"424.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">20 % (doble equipo)</text><line x1=\"58\" y1=\"176.0\" x2=\"546\" y2=\"176.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Masa en riesgo capturada</text></svg><figcaption>Masa imponible en riesgo capturada al 10 % y al 20 % de los empleadores gestionados.</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "Se necesita la planilla Previred real con su calendario de recepción y el Boletín de Infractores de la Dirección del Trabajo. El agregado mensual de masa en riesgo sigue siendo demasiado volátil para comprometerse mes a mes: escalar a más empleadores lo mejora de forma predecible (la volatilidad cae como uno sobre la raíz del número de empleadores), así que ese es el primer paso antes de prometer un número mensual al negocio.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>La captura de masa en riesgo al 10 % queda en 48,6 % en la semilla de referencia, bajo el umbral de aceptación de 50 %, aunque el promedio de cinco semillas (51,9 %) se acerca. En palabras del propio informe, sigue siendo '45-55 % de la masa con el 10 % de la cartera, mejor que la regla en todos los casos', no un cumplimiento sólido. El error del agregado mensual tampoco cumple su criterio de ±10 %: mejoró de 0 a 2 de 12 meses al triplicar los empleadores, pero sigue lejos.</p></div>", "fuente_texto": "afp_lab/riesgo_empleador/README.md §§1, 6.1, 6.3, 6.4, 7"}, {"id": "p01", "numero": "01", "nombre": "rim_nowcasting", "titulo": "Renta imponible en tiempo real (nowcasting)", "area": "Tesorería", "estado_nivel": "ok", "estado_texto": "Cerrado (rondas 1 y 2)", "metrica_principal": "WAPE 0,115 (h=1)", "reserva_corta": "Ronda 2, previa a la recalibración de densidad de la ronda 3.", "problema_html": "La cotización de un afiliado llega a la AFP con dos meses de desfase. ¿Cuál es su renta imponible en esos dos meses que todavía no se conocen?", "resultado_html": "A un mes de desfase, el modelo llega a WAPE 0,115 en los afiliados dependientes (contra 0,215 de simplemente repetir el último dato conocido), igual en la cartera sistema que en la Cuprum. A dos meses el error sube a 0,182 en el sistema y 0,221 en Cuprum: pesa más la remuneración variable de finanzas y minería, que se conoce con más rezago. El clasificador de \"cotiza o no\" llega a AUC 0,969 a un mes y 0,918 a dos meses.", "uso_html": "Alimenta cualquier reporte que necesite un número de recaudación o de saldo 'hoy', sin esperar dos meses: proyección de recaudación, saldo estimado de la cuenta obligatoria, e insumo de historia laboral para los demás modelos del laboratorio.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Recaudación proyectada · rim_nowcasting\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Recaudación proyectada · rim_nowcasting</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,115</div><div class=\"md-kpi-label\">WAPE a un mes (dependientes)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,221</div><div class=\"md-kpi-label\">WAPE a dos meses (Cuprum)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,969</div><div class=\"md-kpi-label\">AUC cotiza/no cotiza, a un mes</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Reemplazo mensual PREDICHA → REAL</td><td>los pagos que llegan sustituyen la proyección</td><td class=\"num\">ciclo automático</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Independientes</td><td>renta anual vía SII, se redibuja cada año</td><td class=\"num\">WAPE alto, modelo aparte recomendado</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Multiempleo y licencias</td><td>un segundo pagador o un subsidio llegan con más rezago</td><td class=\"num\">PARCIAL hasta completarse</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr></tbody>\n      </table>\n    </div>\n    \n  </div>\n</div>", "produccion_html": "El pipeline ya está diseñado para escala real: PySpark, particionado por mes de recepción, sin colecciones al driver. Falta reemplazar el generador sintético por las tablas reales de Previred, SII y el Seguro de Cesantía, y decidir la cadencia de reentrenamiento (trimestral, o disparado cuando el error de los reemplazos mensuales supere un umbral).", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>Este resultado es de la ronda 2, con la densidad de cotización previa a la recalibración de la ronda 3 contra la Ficha 165. La corrección de la ronda 3 que sí se hizo sobre este proyecto (código de movimiento de personal, ficha siguiente) no tocó la densidad; como 01 comparte el generador base con el resto del laboratorio, la pregunta de si el nowcasting cambia con la densidad ya recalibrada, como pasó en 02-06, sigue abierta.</p></div>", "fuente_texto": "afp_lab/rim_nowcasting/README.md §§1, 10, 10b"}, {"id": "p06", "numero": "06", "nombre": "segmentacion_afiliados", "titulo": "Segmentación de afiliados", "area": "Comercial", "estado_nivel": "ok", "estado_texto": "Aprobado (ronda 2)", "metrica_principal": "Silueta 0,2395", "reserva_corta": "ARI temporal (0,4655) más bajo que el de remuestreo: hay deriva real del negocio.", "problema_html": "¿Qué segmentos de comportamiento existen en la cartera de Cuprum, y qué acción corresponde a cada uno?", "resultado_html": "Cuatro segmentos de comportamiento (silueta 0,2395, estable al re-muestrear la cartera: ARI 0,987; un clasificador los reproduce con 0,9812 de exactitud). Las tasas de cese, traspaso y aporte APV difieren 3,38×, 2,08× y 30,69× entre el segmento más y menos propenso: son grupos que de verdad se comportan distinto, no una partición estadística sin sentido de negocio.", "uso_html": "Asignación de ejecutivos, priorización de campañas de retención y de APV, y diseño de mensajes de asesoría previsional distintos por segmento &mdash; una decisión operativa mensual, no un modelo de un evento puntual.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Mapa de segmentos · segmentacion_afiliados\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Mapa de segmentos · segmentacion_afiliados</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">4</div><div class=\"md-kpi-label\">segmentos de comportamiento</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">30,69×</div><div class=\"md-kpi-label\">razón de aporte APV entre segmentos</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,4655</div><div class=\"md-kpi-label\">estabilidad a 6 meses (ARI)</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Segmento 1 · Ahorradores premium</td><td>mayor renta y saldo, líder en aporte APV</td><td class=\"num\">retención de valor prioritaria</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Segmento 3 · Intermitentes</td><td>renta y densidad actuales muy bajas</td><td class=\"num\">mayor tasa de cese</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Segmento 2 · Joven en acumulación</td><td>el más joven, fondo A/B, sin APV</td><td class=\"num\">educación financiera + oferta de entrada</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 560 230\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Razón entre la tasa de negocio del segmento más propenso y el menos propenso\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"186.0\" x2=\"546\" y2=\"186.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"190.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,0×</text><line x1=\"58\" y1=\"149.5\" x2=\"546\" y2=\"149.5\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"153.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">8,8×</text><line x1=\"58\" y1=\"113.0\" x2=\"546\" y2=\"113.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"117.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">17,5×</text><line x1=\"58\" y1=\"76.5\" x2=\"546\" y2=\"76.5\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"80.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">26,2×</text><line x1=\"58\" y1=\"40.0\" x2=\"546\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">35,0×</text><rect x=\"79.1\" y=\"171.9\" width=\"98.7\" height=\"14.1\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"128.5\" y=\"165.9\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">3,4×</text><text x=\"139.3\" y=\"206.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Cese</text><rect x=\"241.8\" y=\"177.3\" width=\"98.7\" height=\"8.7\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"291.2\" y=\"171.3\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">2,1×</text><text x=\"302.0\" y=\"206.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Traspaso</text><rect x=\"404.5\" y=\"58.0\" width=\"98.7\" height=\"128.0\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"453.8\" y=\"52.0\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">30,7×</text><text x=\"464.7\" y=\"206.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">APV</text><line x1=\"58\" y1=\"186.0\" x2=\"546\" y2=\"186.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Razón entre el segmento de mayor y menor tasa</text></svg><figcaption>Razón de tasas de negocio entre el segmento más y menos propenso, por indicador.</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "El clustering usa exclusivamente tablas ya construidas por 02, 03 y el panel laboral propio, así que el camino más corto a producción es correrlo directamente sobre esas mismas fuentes reales una vez que 02 y 03 estén en producción. La asignación de un afiliado nuevo a un segmento no requiere reclusterizar: el clasificador ya entrenado lo hace en línea.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>La estabilidad entre re-muestreos de la misma cartera es alta (0,987), pero la estabilidad entre dos cortes separados por seis meses es más baja (0,4655): parte es deriva real del negocio (alguien deja de cotizar, empieza a aportar), no solo ruido del método, y el informe lo reporta tal cual, sin forzarlo al mismo umbral. El traspaso es, de las tres tasas de negocio, la que separa peor entre segmentos.</p></div>", "fuente_texto": "afp_lab/segmentacion_afiliados/README.md §§1, 6, 7, 8"}, {"id": "p07", "numero": "07", "nombre": "uplift_retencion", "titulo": "A quién conviene contactar (causalidad)", "area": "Comercial", "estado_nivel": "reserva", "estado_texto": "Aprobado con reserva (ronda 4)", "metrica_principal": "Qini X-learner 0,00086", "reserva_corta": "El Qini del holdout aleatorio no alcanza significancia estadística a esta escala.", "problema_html": "Rankear por riesgo de traspaso mezcla a quien se queda igual, a quien se va igual, al persuadible (el contacto lo retiene) y al sleeping dog (el contacto lo hace irse). ¿A cuál de los cuatro tipos hay que llamar?", "resultado_html": "Separando el efecto causal del contacto (X-learner) se evitan 14,6 traspasos contactando al 10 % de la cartera, 4,54× lo que evita usar el ranking de riesgo de churn_traspaso como si fuera uplift (3,2 traspasos evitados). El X-learner también contacta muchos menos \"sleeping dogs\" (afiliados a quienes el contacto empuja a irse) que el ranking de riesgo.", "uso_html": "El ejecutivo propio prioriza su cupo de contacto por el ranking de uplift, no por el de riesgo: deja de llamar automáticamente a quien tiene baja actividad digital y alta sensibilidad a la comisión (sleeping dogs) y prioriza a quien tuvo un reclamo ya resuelto.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: A quién conviene contactar · uplift_retencion\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">A quién conviene contactar · uplift_retencion</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">4,54×</div><div class=\"md-kpi-label\">veces más traspasos evitados que ordenar por riesgo</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">14,6</div><div class=\"md-kpi-label\">traspasos evitados al 10 %</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,195</div><div class=\"md-kpi-label\">correlación con el efecto causal real (DR-learner)</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Persuadible</td><td>reclamo reciente ya resuelto, saldo y uso digital medios</td><td class=\"num\">contactar: el contacto retiene</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr><tr class=\"sev-critical\"><td><span class=\"stripe stripe-critical\" aria-hidden=\"true\"></span>Sleeping dog</td><td>uso digital bajo, muy sensible a la comisión</td><td class=\"num\">NO contactar: el contacto empuja a irse</td><td><span class=\"chip chip-critico\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>crítico</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Validación sin sesgo (holdout aleatorio)</td><td>el Qini del holdout no alcanza significancia estadística a esta escala</td><td class=\"num\">ver reserva</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 580 240\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Traspasos evitados contactando al 10 % y 20 % de la cartera, causalidad vs. riesgo\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"196.0\" x2=\"566\" y2=\"196.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"200.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,0</text><line x1=\"58\" y1=\"157.0\" x2=\"566\" y2=\"157.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"161.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">6,7</text><line x1=\"58\" y1=\"118.0\" x2=\"566\" y2=\"118.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"122.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">13,3</text><line x1=\"58\" y1=\"79.0\" x2=\"566\" y2=\"79.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"83.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">20,0</text><line x1=\"58\" y1=\"40.0\" x2=\"566\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">26,6</text><rect x=\"91.0\" y=\"110.5\" width=\"77.1\" height=\"85.5\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"129.6\" y=\"104.5\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">14,6</text><rect x=\"185.0\" y=\"177.2\" width=\"77.1\" height=\"18.8\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"223.5\" y=\"171.2\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">3,2</text><text x=\"185.0\" y=\"216.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">10 % de la cartera</text><rect x=\"345.0\" y=\"74.1\" width=\"77.1\" height=\"121.9\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"383.6\" y=\"68.1\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">20,8</text><rect x=\"439.0\" y=\"151.5\" width=\"77.1\" height=\"44.5\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"477.5\" y=\"145.5\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">7,6</text><text x=\"439.0\" y=\"216.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">20 % de la cartera</text><line x1=\"58\" y1=\"196.0\" x2=\"566\" y2=\"196.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Separar causalidad (X-learner)</text><rect x=\"298.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"314.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Ordenar por riesgo (02)</text></svg><figcaption>Traspasos evitados contactando al 10 % y al 20 % de la cartera (verdad del simulador).</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "Esto exige lo que hoy no existe: un holdout aleatorio real de contacto (a quién se llama lo decide una moneda, no el ejecutivo) durante algunos meses, del tamaño suficiente para medir Qini con significancia. Sin ese piloto, la recomendación se apoya en la verdad del simulador, que solo existe en este sandbox.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>El único criterio de aceptación duro (Qini positivo en los tres cortes de test, sobre el holdout aleatorio sin sesgo) lo cumple solo el X-learner, y con un intervalo de confianza que cruza cero: no se puede afirmar con confianza estadística que le gane al azar en ese holdout. La recomendación de negocio se apoya en la correlación contra la verdad del simulador y en la métrica de negocio oracular, ambas posibles solo en este sandbox, no en el mundo real todavía.</p></div>", "fuente_texto": "afp_lab/uplift_retencion/README.md §§1, 6.2, 6.3, 6.4, 7, 8"}, {"id": "p08", "numero": "08", "nombre": "secuencial_afiliado", "titulo": "Representación secuencial del afiliado", "area": "Operaciones", "estado_nivel": "reserva", "estado_texto": "Aprobado con reserva (ronda 4)", "metrica_principal": "AUC red 0,5848", "reserva_corta": "Alcance de dos de cuatro cabezas; runtime no validado a 20.000.", "problema_html": "¿Una red neuronal que lee la historia mensual completa del afiliado, en vez de un conjunto de features tabulares, predice mejor el traspaso y el cese que los modelos de producción de 02 y 04?", "resultado_html": "La red (GRU de dos capas, multi-tarea) no mejora al LightGBM de producción en ninguna de las dos tareas: AUC 0,5848 vs. 0,7255 en traspaso (0,141 de caída) y 0,7768 vs. 0,8610 en cese (0,084 de caída). Pero, con la MISMA información que ve la red, un LightGBM sobre esa misma secuencia aplanada obtiene 0,5940 y 0,7775: prácticamente empatado con la red (diferencias de 0,001 a 0,009 AUC). La brecha grande no es de arquitectura: es que la secuencia (el panel laboral común, sin las tablas comerciales de la AFP) lleva mucha menos información que las features completas de traspaso y cese.", "uso_html": "Ninguno todavía: la recomendación explícita es no reemplazar los pipelines tabulares de 02 y 04 con esta arquitectura, a este presupuesto de datos y cómputo.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Comparación de arquitecturas · secuencial_afiliado\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Comparación de arquitecturas · secuencial_afiliado</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,7255</div><div class=\"md-kpi-label\">AUC LightGBM producción (traspaso)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,5848</div><div class=\"md-kpi-label\">AUC red secuencial (traspaso)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,141</div><div class=\"md-kpi-label\">brecha de AUC</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-critical\"><td><span class=\"stripe stripe-critical\" aria-hidden=\"true\"></span>Red no aporta en ninguna cabeza</td><td>criterio del brief: mejora ≥ 0,01 AUC en al menos dos cabezas</td><td class=\"num\">no se cumple</td><td><span class=\"chip chip-critico\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>crítico</span></td></tr><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Empata con LightGBM de la misma información</td><td>aísla arquitectura de información</td><td class=\"num\">diferencia &lt; 0,01 AUC</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Multi-tarea no le gana al single-task</td><td>compartir encoder no ayudó a esta escala</td><td class=\"num\">diferencia dentro del ruido</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 560 240\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"AUC del LightGBM de producción vs. la red secuencial, traspaso y cese\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"196.0\" x2=\"546\" y2=\"196.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"200.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,000</text><line x1=\"58\" y1=\"157.0\" x2=\"546\" y2=\"157.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"161.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,276</text><line x1=\"58\" y1=\"118.0\" x2=\"546\" y2=\"118.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"122.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,551</text><line x1=\"58\" y1=\"79.0\" x2=\"546\" y2=\"79.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"83.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,827</text><line x1=\"58\" y1=\"40.0\" x2=\"546\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">1,102</text><rect x=\"89.7\" y=\"93.3\" width=\"74.0\" height=\"102.7\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"126.7\" y=\"87.3\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,726</text><rect x=\"180.0\" y=\"113.2\" width=\"74.0\" height=\"82.8\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"217.0\" y=\"107.2\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,585</text><text x=\"180.0\" y=\"216.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Traspaso (02)</text><rect x=\"333.7\" y=\"74.1\" width=\"74.0\" height=\"121.9\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"370.7\" y=\"68.1\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,861</text><rect x=\"424.0\" y=\"86.0\" width=\"74.0\" height=\"110.0\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"461.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,777</text><text x=\"424.0\" y=\"216.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Cese (04)</text><line x1=\"58\" y1=\"196.0\" x2=\"546\" y2=\"196.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">LightGBM de producción</text><rect x=\"245.2\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"261.2\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Red secuencial (multi-tarea)</text></svg><figcaption>AUC del LightGBM de producción vs. la red secuencial multi-tarea, mismos cortes y splits.</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "No se recomienda avanzar con esta arquitectura mientras la secuencia no incorpore las mismas fuentes que ya usan los modelos de producción (contactos, reclamos, saldos, cambios de fondo, uso digital, brecha de rentabilidad). El valor futuro de una representación secuencial dependería de sumarle esas fuentes y de probarla en afiliados con historia más larga que la de este sandbox.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>El entrenamiento se acotó a 7 cortes de entrenamiento, sin calibrar las probabilidades de la red y sin una búsqueda amplia de hiperparámetros (arquitectura, tamaño del embedding, número de capas), por presupuesto de esta ronda. La conclusión &mdash;'no aporta frente al modelo de producción'&mdash; es honesta y aísla bien la causa (información, no arquitectura), pero no cierra la pregunta de si una red secuencial con más datos y más búsqueda de hiperparámetros cambiaría el resultado. La revisión adversarial (aprobada con reserva) marca dos puntos de alcance: el proyecto cubre dos de las cuatro cabezas del brief (traspaso y cese; faltan APV y RIM), y el runtime nunca se corrió a la escala de 20.000 afiliados que exige la convención del laboratorio, solo a 10.000 afiliados. El revisor reprodujo las cifras casi dígito a dígito; la única que no calzó exacto fue el LightGBM de producción en cese (0,8614 reproducido vs. 0,8610 del README), una diferencia mínima que no cambia ninguna conclusión.</p></div>", "fuente_texto": "afp_lab/secuencial_afiliado/README.md §§1, 6, 7, 8"}, {"id": "p09", "numero": "09", "nombre": "bandit_contacto", "titulo": "Bandit contextual de contacto", "area": "Comercial", "estado_nivel": "ok", "estado_texto": "Aprobado (ronda 4)", "metrica_principal": "DR err. 0,1 %", "reserva_corta": "Gana a eps-greedy en 3/5 semillas, no en las 4/5 exigidas.", "problema_html": "Cada mes hay que elegir, para cada afiliado en riesgo, entre no contactar, email, llamada, visita o una oferta de ahorro. ¿Se puede aprender esa decisión sobre la marcha, y auditarla antes de arriesgar presupuesto real?", "resultado_html": "Con la heterogeneidad calibrada para este sandbox, Thompson lineal gana a un simple promedio por canal (epsilon-greedy) en 3/5 semillas, no en las 4/5 que exige el criterio de aceptación. Recién le gana en 4/5 semillas si la heterogeneidad real fuera cuatro veces más fuerte de lo calibrado. La política vigente (heurística por riesgo) genera 80 M CLP más que no contactar a nadie en 24 meses, pero gastando el doble que las alternativas y contactando a más sleeping dogs.", "uso_html": "Hoy, ninguno: la recomendación es no reemplazar la heurística vigente. El candidato para un piloto acotado, corriendo en paralelo sin desplazar la política actual, es la variante que aprende con LightGBM, que es la única que de verdad distingue a quién conviene o no contactar.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Política de contacto · bandit_contacto\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Política de contacto · bandit_contacto</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">2,116 mil M CLP</div><div class=\"md-kpi-label\">retención neta, política actual (mil M CLP)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">2,138 mil M CLP</div><div class=\"md-kpi-label\">retención neta, Thompson lineal (mil M CLP)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,1 %</div><div class=\"md-kpi-label\">error del mejor estimador off-policy</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Bandit contextual todavía no reemplaza la heurística</td><td>gana a eps-greedy en pocas semillas</td><td class=\"num\">3/5 semillas (exigido: 4/5)</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr><tr class=\"sev-critical\"><td><span class=\"stripe stripe-critical\" aria-hidden=\"true\"></span>LinUCB se apaga</td><td>contacta a casi nadie, y peor que el azar cuando lo hace</td><td class=\"num\">no desplegar tal cual</td><td><span class=\"chip chip-critico\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>crítico</span></td></tr><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Auditoría off-policy antes de arriesgar presupuesto</td><td>los tres estimadores dentro del umbral de error</td><td class=\"num\">bajo 15 %</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 580 250\" width=\"100%\" height=\"auto\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"36.0\" x2=\"566\" y2=\"36.0\" stroke=\"var(--border)\"/><text x=\"50\" y=\"40.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">2,160</text><line x1=\"58\" y1=\"79.5\" x2=\"566\" y2=\"79.5\" stroke=\"var(--border)\"/><text x=\"50\" y=\"83.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">2,150</text><line x1=\"58\" y1=\"123.0\" x2=\"566\" y2=\"123.0\" stroke=\"var(--border)\"/><text x=\"50\" y=\"127.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">2,141</text><line x1=\"58\" y1=\"166.5\" x2=\"566\" y2=\"166.5\" stroke=\"var(--border)\"/><text x=\"50\" y=\"170.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">2,131</text><line x1=\"58\" y1=\"210.0\" x2=\"566\" y2=\"210.0\" stroke=\"var(--border)\"/><text x=\"50\" y=\"214.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">2,121</text><text x=\"58.0\" y=\"230.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">0×</text><text x=\"227.3\" y=\"230.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">1×</text><text x=\"396.7\" y=\"230.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">2×</text><text x=\"566.0\" y=\"230.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">4×</text><polyline points=\"58.0,138.6 227.3,134.1 396.7,143.0 566.0,71.8\" fill=\"none\" stroke=\"var(--accent-2)\" stroke-width=\"2.6\"/><circle cx=\"58.0\" cy=\"138.6\" r=\"4\" fill=\"var(--accent-2)\"/><circle cx=\"227.3\" cy=\"134.1\" r=\"4\" fill=\"var(--accent-2)\"/><circle cx=\"396.7\" cy=\"143.0\" r=\"4\" fill=\"var(--accent-2)\"/><circle cx=\"566.0\" cy=\"71.8\" r=\"4\" fill=\"var(--accent-2)\"/><polyline points=\"58.0,134.1 227.3,169.7 396.7,174.2 566.0,147.5\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2.6\"/><circle cx=\"58.0\" cy=\"134.1\" r=\"4\" fill=\"var(--muted)\"/><circle cx=\"227.3\" cy=\"169.7\" r=\"4\" fill=\"var(--muted)\"/><circle cx=\"396.7\" cy=\"174.2\" r=\"4\" fill=\"var(--muted)\"/><circle cx=\"566.0\" cy=\"147.5\" r=\"4\" fill=\"var(--muted)\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Thompson lineal (bandit)</text><rect x=\"262.4\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"278.4\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Epsilon-greedy (sin contexto)</text><line x1=\"58\" y1=\"210.0\" x2=\"566\" y2=\"210.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/></svg><figcaption>Retención neta acumulada (24 meses) según qué tan fuerte sea la heterogeneidad de respuesta al contacto.</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "El guardrail principal, si algún día se despliega: nunca en explotación total, mantener siempre una fracción de exploración en los cinco brazos para poder seguir auditando con evaluación off-policy, y monitorear la tasa de contactos a quienes de todas formas terminan yéndose (proxy observable de sleeping dog, porque el tipo real nunca se observa).", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>Los resultados principales que el brief esperaba (Thompson o LinUCB le ganan a lo simple en cuatro de cinco semillas; el estimador doblemente robusto es el de menor error) no se cumplen tras la corrección del generador. En palabras del propio equipo: 'el bandit contextual, con esta calibración de señal y 24 meses, no justifica reemplazar la heurística todavía'. Se reporta así, sin forzarlo, porque el objetivo de esta ronda era saber, no ganar.</p></div>", "fuente_texto": "afp_lab/bandit_contacto/README.md §§1, 6.1, 6.3, 6.5, 7, 8"}, {"id": "planilla", "numero": "—", "nombre": "common/planilla", "titulo": "Planilla regulatoria (modelo de datos)", "area": "Normativa", "estado_nivel": "ok", "estado_texto": "Aprobado (ronda 2)", "metrica_principal": "12 códigos de la Tabla N° 7", "reserva_corta": "El sorteo de recepción es por línea, no por planilla completa (defecto menor).", "problema_html": "Para que un modelo sirva en producción tiene que entrenar con la misma estructura de datos que va a ver ahí: los códigos oficiales de la planilla Previred, no una simplificación propia de cada proyecto.", "resultado_html": "La planilla sintética reproduce 12 códigos de movimiento de personal de la Tabla N° 7 (altas, bajas, licencias, cambios de contrato), con el mismo desfase de recepción que usan los modelos de renta y de cese. Cuando se probó como feature adicional en riesgo_cese_cotizacion, el aporte fue marginal e inconsistente en signo, y en rim_nowcasting fue chico y concentrado en la cartera Cuprum: en los dos casos buena parte de la información ya estaba, por otra vía, en los eventos del Seguro de Cesantía. El esquema de columnas quedó además documentado, columna por columna, contra la norma (Compendio de la SP y Previred) en docs/modelo_datos_regulatorio.md.", "uso_html": "Es infraestructura compartida, no un modelo de decisión propio: la usan riesgo_empleador (capa de recepción y pago del empleador) y se probó como feature en riesgo_cese_cotizacion.", "dashboard_html": "", "produccion_html": "Es la pieza más cercana a producción: en cuanto existan credenciales de acceso a la planilla real (Previred) y al Boletín de Infractores, los proyectos 01, 04 y 05 pueden apuntar a esa fuente sin cambiar su lógica de features, porque ya están escritos contra esta misma estructura de columnas.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>El sorteo de recepción y estado de pago se hace línea por línea, no por planilla completa: dos líneas de la misma declaración pueden quedar con fecha de recepción distinta, lo que contradice el propio docstring del módulo. Es un defecto de código menor, ya identificado y documentado, pendiente de corregir; no inva
