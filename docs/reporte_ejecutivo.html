lida ningún resultado de los proyectos que la usan.</p></div>", "fuente_texto": "afp_lab/common/BRIEF_PLANILLA.md; afp_lab/riesgo_empleador/README.md §2; afp_lab/riesgo_cese_cotizacion/README.md §11.2"}, {"id": "p01-correccion", "numero": "—", "nombre": "rim_nowcasting (ronda 3)", "titulo": "Código de movimiento de personal en el nowcasting", "area": "Tesorería", "estado_nivel": "reserva", "estado_texto": "Aprobado con reserva (ronda 3)", "metrica_principal": "WAPE Cuprum h=2 0,270", "reserva_corta": "Redundante en 87 % con el aviso AFC; ayuda solo en Cuprum a dos meses.", "problema_html": "¿Ayuda a proyectar mejor la renta imponible agregar a 01 el código de movimiento de personal de la propia planilla (altas, bajas, licencias) además del aviso del Seguro de Cesantía que ya usaba?", "resultado_html": "A escala de referencia (5.000 afiliados, 12 orígenes de entrenamiento), agregar el código de movimiento de personal (Tabla N° 7) al nowcasting de RIM no cambia el WAPE de Sistema (0,196 → 0,194 a un mes; 0,258 → 0,259 a dos meses), y sí mejora a Cuprum a dos meses (0,304 → 0,270, sesgo agregado de -6,8 % a -3,4 %); a un mes Cuprum queda igual (0,210 → 0,212). El AUC de cotiza/no cotiza no se mueve (0,969 a un mes; 0,918 → 0,919 a dos meses). El runtime de la corrida de referencia sigue en torno a 6 minutos, sin aumento medible.", "uso_html": "Queda disponible como familia de features opcional: no se activa por defecto porque su aporte es chico salvo en la cartera Cuprum a dos meses, donde sí vale la pena.", "dashboard_html": "\n<div class=\"mockup\" role=\"group\" aria-label=\"Mockup: Nowcasting con código de movimiento · rim_nowcasting\">\n  <div class=\"mockup-bar\"><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span><span class=\"mockup-dot\"></span>\n    <span class=\"mockup-title\">Nowcasting con código de movimiento · rim_nowcasting</span></div>\n  <div class=\"mockup-body\">\n    <div class=\"md-kpis\"><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,270</div><div class=\"md-kpi-label\">WAPE Cuprum h=2 (con el código nuevo)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">0,259</div><div class=\"md-kpi-label\">WAPE Sistema h=2 (sin cambio material)</div></div><div class=\"md-kpi\"><div class=\"md-kpi-num\">-95 %</div><div class=\"md-kpi-label\">sesgo en término reciente (debilidad previa)</div></div></div>\n    <div class=\"md-table-wrap\">\n      <table class=\"md-table\">\n        <thead><tr><th>Alerta</th><th>Detalle</th><th>Valor</th><th>Estado</th></tr></thead>\n        <tbody><tr class=\"sev-ok\"><td><span class=\"stripe stripe-ok\" aria-hidden=\"true\"></span>Cuprum, segundo mes</td><td>el código de movimiento sí aporta aquí</td><td class=\"num\">0,304 → 0,270</td><td><span class=\"chip chip-ok\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>ok</span></td></tr><tr class=\"sev-warn\"><td><span class=\"stripe stripe-warn\" aria-hidden=\"true\"></span>Con subsidio (licencia en curso)</td><td>mejora algo en ambos horizontes</td><td class=\"num\">0,169 → 0,154</td><td><span class=\"chip chip-warn\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>atención</span></td></tr><tr class=\"sev-critical\"><td><span class=\"stripe stripe-critical\" aria-hidden=\"true\"></span>Término reciente (aviso AFC)</td><td>sesgo grande en ambas versiones, no lo corrige el código nuevo</td><td class=\"num\">≈-95 %</td><td><span class=\"chip chip-critico\"><span class=\"chip-dot\" aria-hidden=\"true\"></span>crítico</span></td></tr></tbody>\n      </table>\n    </div>\n    <div class=\"md-chart\"><figure><svg viewBox=\"0 0 620 250\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"WAPE antes y después de agregar el código de movimiento de personal, por perfil y horizonte\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"206.0\" x2=\"606\" y2=\"206.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"210.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,000</text><line x1=\"58\" y1=\"164.5\" x2=\"606\" y2=\"164.5\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"168.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,097</text><line x1=\"58\" y1=\"123.0\" x2=\"606\" y2=\"123.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"127.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,195</text><line x1=\"58\" y1=\"81.5\" x2=\"606\" y2=\"81.5\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"85.5\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,292</text><line x1=\"58\" y1=\"40.0\" x2=\"606\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,389</text><rect x=\"75.8\" y=\"122.4\" width=\"41.6\" height=\"83.6\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"96.6\" y=\"116.4\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,196</text><rect x=\"126.5\" y=\"123.2\" width=\"41.6\" height=\"82.8\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"147.3\" y=\"117.2\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,194</text><text x=\"126.5\" y=\"226.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Sistema h=1</text><rect x=\"212.8\" y=\"95.9\" width=\"41.6\" height=\"110.1\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"233.6\" y=\"89.9\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,258</text><rect x=\"263.5\" y=\"95.5\" width=\"41.6\" height=\"110.5\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"284.3\" y=\"89.5\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,259</text><text x=\"263.5\" y=\"226.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Sistema h=2</text><rect x=\"349.8\" y=\"116.4\" width=\"41.6\" height=\"89.6\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"370.6\" y=\"110.4\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,210</text><rect x=\"400.5\" y=\"115.6\" width=\"41.6\" height=\"90.4\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"421.3\" y=\"109.6\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,212</text><text x=\"400.5\" y=\"226.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Cuprum h=1</text><rect x=\"486.8\" y=\"76.3\" width=\"41.6\" height=\"129.7\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"507.6\" y=\"70.3\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,304</text><rect x=\"537.5\" y=\"90.8\" width=\"41.6\" height=\"115.2\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"558.3\" y=\"84.8\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,270</text><text x=\"537.5\" y=\"226.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Cuprum h=2</text><line x1=\"58\" y1=\"206.0\" x2=\"606\" y2=\"206.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Antes (sin código de movimiento)</text><rect x=\"311.2\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent-2)\" rx=\"2\"/><text x=\"327.2\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Después (con código Tabla N° 7)</text></svg><figcaption>WAPE antes y después de agregar el código de movimiento de personal, por perfil y horizonte.</figcaption></figure></div>\n  </div>\n</div>", "produccion_html": "El diseño as-of ya está probado (siete tests nuevos, sin fuga hacia el futuro) y usa las mismas constantes de la planilla común, así que sumar esta familia de features en producción es barato una vez conectada la planilla Previred real. La recomendación es dejarla como familia de features opcional, no obligatoria: el aporte es chico y concentrado en un segmento.", "reserva_html": "<div class=\"reserva\"><span class=\"reserva-tag\">Reserva principal</span><p>La señal es en gran parte redundante con el aviso del Seguro de Cesantía: el código de término coincide con el término AFC en el 87 % de los casos, lo que explica el efecto casi nulo en Sistema. Con una sola semilla, un delta de ±0,03 en un segmento chico (independientes, 0,85-0,89 de WAPE) no se puede declarar significativo. El segmento de término reciente sigue con un sesgo cercano a -95 % en ambas versiones: una debilidad previa del modelo que este código no corrige.</p></div>", "fuente_texto": "afp_lab/rim_nowcasting/README.md §10c"}], "torre_control": {"kpis": [["35,0 %", "traspasos capturados (churn, 10 %)"], ["67,8 %", "ahorro APV capturado (10 %)"], ["63,1 %", "ceses capturados (10 %)"], ["48,6 %", "masa en riesgo capturada (10 %)"], ["23.943 MM CLP", "en riesgo, licitación 2027"], ["2,116 mil M CLP", "retención neta, política actual (24 meses)"]], "filas": [{"area": "Tesorería", "severidad": "critical", "alerta": "Licitación de stock 2027", "detalle": "sorteo de afiliados no pensionados, Ley 21.735", "valor": "6,2 % del saldo Cuprum"}, {"area": "Riesgo", "severidad": "warn", "alerta": "Reingreso tras cese", "detalle": "AUC bajo el umbral del brief tras recalibrar la densidad", "valor": "0,608"}, {"area": "Riesgo", "severidad": "warn", "alerta": "Masa en riesgo de empleadores", "detalle": "captura al 10 % en el límite del criterio de negocio", "valor": "48,6 %"}, {"area": "Comercial", "severidad": "ok", "alerta": "Traspaso voluntario", "detalle": "el modelo gana a la regla en todos los segmentos grandes", "valor": "1,80× la regla"}, {"area": "Comercial", "severidad": "ok", "alerta": "Ahorro voluntario (APV)", "detalle": "líderes de mercado, captura muy por sobre ordenar por renta", "valor": "67,8 %"}], "chart_svg": "<svg viewBox=\"0 0 680 280\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"AUC del modelo vs. la práctica actual, cuatro capacidades de priorización\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"58\" y1=\"236.0\" x2=\"666\" y2=\"236.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"240.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,000</text><line x1=\"58\" y1=\"187.0\" x2=\"666\" y2=\"187.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"191.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,284</text><line x1=\"58\" y1=\"138.0\" x2=\"666\" y2=\"138.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"142.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,568</text><line x1=\"58\" y1=\"89.0\" x2=\"666\" y2=\"89.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"93.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">0,852</text><line x1=\"58\" y1=\"40.0\" x2=\"666\" y2=\"40.0\" stroke=\"var(--border)\" stroke-width=\"1\"/><text x=\"50\" y=\"44.0\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\" font-family=\"var(--font-mono)\">1,135</text><rect x=\"77.8\" y=\"111.7\" width=\"46.1\" height=\"124.3\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"100.8\" y=\"105.7\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,720</text><rect x=\"134.0\" y=\"132.8\" width=\"46.1\" height=\"103.2\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"157.1\" y=\"126.8\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,598</text><text x=\"134.0\" y=\"256.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Traspaso (02)</text><rect x=\"229.8\" y=\"91.7\" width=\"46.1\" height=\"144.3\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"252.8\" y=\"85.7\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,836</text><rect x=\"286.0\" y=\"113.6\" width=\"46.1\" height=\"122.4\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"309.1\" y=\"107.6\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,709</text><text x=\"286.0\" y=\"256.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">APV (03)</text><rect x=\"381.8\" y=\"82.9\" width=\"46.1\" height=\"153.1\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"404.8\" y=\"76.9\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,887</text><rect x=\"438.0\" y=\"98.2\" width=\"46.1\" height=\"137.8\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"461.1\" y=\"92.2\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,798</text><text x=\"438.0\" y=\"256.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Cese (04)</text><rect x=\"533.8\" y=\"86.7\" width=\"46.1\" height=\"149.3\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"556.8\" y=\"80.7\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,865</text><rect x=\"590.0\" y=\"105.5\" width=\"46.1\" height=\"130.5\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"613.1\" y=\"99.5\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"var(--ink)\" font-family=\"var(--font-mono)\">0,756</text><text x=\"590.0\" y=\"256.0\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--ink)\">Empleador (05)</text><line x1=\"58\" y1=\"236.0\" x2=\"666\" y2=\"236.0\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><rect x=\"58.0\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--accent)\" rx=\"2\"/><text x=\"74.0\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Modelo</text><rect x=\"139.6\" y=\"9.0\" width=\"11\" height=\"11\" fill=\"var(--muted)\" rx=\"2\"/><text x=\"155.6\" y=\"18.0\" font-size=\"11.5\" fill=\"var(--ink)\">Práctica actual</text></svg>", "chart_caption": "AUC del modelo vs. la práctica actual hoy, en las cuatro capacidades de priorización de cartera."}, "roadmap": [{"titulo": "Piloto de retención con holdout aleatorio real", "desc": "Reservar un grupo de contacto aleatorio (churn_traspaso y uplift_retencion) durante algunos meses, del tamaño suficiente para medir con significancia si separar causalidad mejora la retención. Es el mismo diseño que ya se simuló, pero con afiliados reales.", "pide": "Datos y patrocinio: capacidad de contacto del equipo comercial, y que el negocio acepte que un grupo de control no se contacte por un tiempo definido."}, {"titulo": "Datos reales de planilla, AFC y Boletín de Infractores", "desc": "Conectar 01, 04 y 05 a la planilla Previred real (con su calendario de recepción), a los eventos del Seguro de Cesantía y al Boletín de Infractores de la Dirección del Trabajo.", "pide": "Patrocinio de TI/Operaciones para el acceso, y un ciclo de validación con los mismos criterios que ya se aplicaron en el sandbox."}, {"titulo": "Corregir el generador para que el reingreso vuelva a ser predecible", "desc": "Antes de reintentar 04 con datos reales, separar en el generador sintético la cesantía reciente de la crónica, como ya lo propone el propio informe de la ronda 3.", "pide": "Solo trabajo interno del equipo; ningún dato ni patrocinio externo."}, {"titulo": "Escalar riesgo_empleador a la cartera completa de empleadores", "desc": "Repetir la corrida con el universo completo de empleadores de Cuprum (no solo una muestra), porque la volatilidad del agregado mensual baja de forma predecible al escalar.", "pide": "Patrocinio para correr a esa escala y, más adelante, datos reales de cobranza."}, {"titulo": "Presupuesto separado para la licitación de 2027", "desc": "Preparar, con un año de anticipación, dos campañas de retención separadas: una para el sorteo de la licitación de stock y otra para el churn voluntario de siempre, porque compiten por el mismo cupo de contacto y el sorteo lo consume casi todo.", "pide": "Decisión y presupuesto del negocio, con tiempo suficiente antes de agosto de 2027."}, {"titulo": "Piloto acotado del bandit de contacto, sin desplazar la heurística", "desc": "Correr en paralelo, con más presupuesto de contactos y más tiempo que los 24 meses simulados, la variante que aprendió a discriminar de verdad (Thompson con LightGBM), y volver a auditar con evaluación off-policy antes de subir su participación.", "pide": "Patrocinio para un piloto controlado; ningún cambio a la política vigente todavía."}], "supuestos": {"intro": "Todo lo que se afirma en este informe con un número viene del sandbox sintético, salvo cuando se cita explícitamente la Ficha 165 de la Superintendencia de Pensiones o la Ley 21.735. Ningún resultado se presenta \"en el límite\" como si cumpliera: cuando una cifra queda al borde de un umbral (masa en riesgo de riesgo_empleador) o por debajo de él (reingreso de riesgo_cese_cotizacion, el criterio de Thompson en bandit_contacto), se dice tal cual, con las mismas palabras que usó la revisión.", "datos": ["Las seis AFP del sandbox, sus comisiones y rentabilidades son ficticias salvo Cuprum, cuya comisión (1,44 %) y rentabilidad a 36 meses (fondo C: 5,99 %) sí son la cifra real de la Ficha 165.", "La densidad de cotización del universo sintético se recalibró en la ronda 3 contra la Ficha 165: el perfil sistema pasó de 78-79 % a 47,7-47,8 % (objetivo: 47,3 %) y el perfil Cuprum de 71-73 % a 66,4-66,5 % (objetivo: 66,94 %).", "Los parámetros de comportamiento (probabilidades de reclamo, de visita de la competencia, de aporte voluntario, de declaración y no pago) son supuestos razonables para Chile, documentados uno por uno en cada README, no series oficiales.", "La fuga bruta mensual de Cuprum (a diferencia del neto, que sí publica la Ficha 165: 4.128 traspasos netos en junio de 2026) no está disponible públicamente; se usa un supuesto de trabajo anclado al promedio del sistema."], "modelos": ["Ninguna cifra de este informe se redondeó hacia arriba. Donde una cifra tiene rango entre semillas, se muestra el rango o la semilla de referencia, no el mejor caso.", "Los criterios de aceptación se fijaron antes de ver los resultados y no se relajaron para que un proyecto pasara: donde no se cumplen (04 reingreso, 05 masa en riesgo, 09 bandit), se dice.", "Todos los proyectos comparten universo, pero no todos comparten escala: uplift_retencion y bandit_contacto corrieron a 10.000 afiliados (no 20.000 afiliados) por restricción de tiempo de esta ronda, validado además a mayor escala en uplift_retencion."]}, "anexo": [{"proyecto": "01 rim_nowcasting", "datos": "5.000 afiliados, PySpark", "modelo": "Hurdle: GBT clasificador + regresor", "metrica": "WAPE 0,115 (h=1)", "tests": "18", "runtime": "6 minutos", "revision": "Ronda 3 — docs/revisiones/ronda_3/datos.md"}, {"proyecto": "02 churn_traspaso", "datos": "20.000 afiliados", "modelo": "LightGBM binario + calibración", "metrica": "AUC 0,720", "tests": "39", "runtime": "60 s", "revision": "Rondas 1, 2 y 3 — docs/revisiones/ronda_1/churn_traspaso.md; ronda_2/churn_traspaso.md; ronda_3/churn.md"}, {"proyecto": "03 propension_apv", "datos": "20.000 afiliados", "modelo": "Hurdle: LightGBM clasificador + regresor", "metrica": "AUC 0,836", "tests": "26", "runtime": "86 s", "revision": "Rondas 1 y 2 — docs/revisiones/ronda_1/propension_apv.md; ronda_2/propension_apv.md"}, {"proyecto": "04 riesgo_cese_cotizacion", "datos": "20.000 afiliados", "modelo": "3 × LightGBM binario + calibración", "metrica": "AUC cese 0,887", "tests": "29", "runtime": "50,1 s", "revision": "Rondas 1 y 2 — docs/revisiones/ronda_1/riesgo_cese_cotizacion.md; ronda_2/riesgo_cese_cotizacion.md. Corrección posterior a la ronda 3 (ronda 4): aprobada — docs/revisiones/ronda_4/cese_correccion.md"}, {"proyecto": "05 riesgo_empleador", "datos": "20.000 afiliados (~1.000 empleadores)", "modelo": "LightGBM binario por objetivo", "metrica": "AUC 0,865", "tests": "21", "runtime": "26 s", "revision": "Rondas 2 y 3 — docs/revisiones/ronda_2/riesgo_empleador.md; ronda_3/empleador.md"}, {"proyecto": "06 segmentacion_afiliados", "datos": "20.000 afiliados", "modelo": "k-means + clasificador LightGBM", "metrica": "Silueta 0,2395", "tests": "14", "runtime": "90,8 s", "revision": "Ronda 2 — docs/revisiones/ronda_2/planilla_cese_segmentacion.md"}, {"proyecto": "07 uplift_retencion", "datos": "10.000 afiliados", "modelo": "T-, X- y DR-learner sobre LightGBM", "metrica": "Qini X-learner 0,00086", "tests": "13", "runtime": "26,2 s", "revision": "Ronda 4 — docs/revisiones/ronda_4/uplift.md"}, {"proyecto": "08 secuencial_afiliado", "datos": "10.000 afiliados", "modelo": "GRU multi-tarea (PyTorch) vs. LightGBM", "metrica": "AUC 0,5848 (red, traspaso)", "tests": "7", "runtime": "228,9 s", "revision": "Aprobado con reserva (ronda 4) — docs/revisiones/ronda_4/secuencial.md"}, {"proyecto": "09 bandit_contacto", "datos": "10.000 afiliados", "modelo": "ε-greedy, LinUCB, Thompson (lineal y LightGBM)", "metrica": "DR err. 0,1 % (ε-greedy)", "tests": "19", "runtime": "8-9 s", "revision": "Ronda 4 — docs/revisiones/ronda_4/bandit.md"}], "glosario": [{"termino": "Afiliado / cotizante", "definicion": "Afiliado es cualquier persona con cuenta en la AFP; cotizante es quien pagó una cotización el mes de referencia. La razón entre ambos es la densidad de cotización."}, {"termino": "AUC", "definicion": "Qué tan bien ordena el modelo a quién le va a pasar el evento primero. 0,50 es no mejor que el azar; 1,00 es perfecto. No dice nada sobre el número absoluto de casos."}, {"termino": "Baseline / regla de negocio", "definicion": "La forma en que se decide hoy, sin el modelo (por ejemplo, ordenar por renta o por una regla simple). Es la vara con la que se mide si el modelo aporta."}, {"termino": "Captura al 10 %", "definicion": "Del total de casos que van a ocurrir, qué fracción cae dentro del 10 % de la cartera que el modelo marca como más riesgosa u oportuna. Es la métrica de negocio, no la técnica."}, {"termino": "Cortes / periodo_corte", "definicion": "El mes en que se toma la decisión ('hoy' para el modelo). El resultado se mide en los meses siguientes, nunca antes."}, {"termino": "Densidad de cotización", "definicion": "Fracción de afiliados que cotizó en un mes típico. Cuprum tiene la densidad más alta del sistema."}, {"termino": "Fuga de información (leakage)", "definicion": "Cuando el modelo, por error, ve información del futuro al entrenar. Cada proyecto tiene tests específicos para detectarla."}, {"termino": "Gap (purga)", "definicion": "Meses que se descartan entre el entrenamiento y la prueba de un modelo, para que ningún dato de entrenamiento roce el periodo que se está evaluando."}, {"termino": "Latente", "definicion": "Un dato que existe solo dentro del simulador para generar la dinámica (por ejemplo, la propensión verdadera a irse). Nunca puede ser una feature del modelo, porque en la vida real no se observa."}, {"termino": "Off-policy (evaluación fuera de política)", "definicion": "Estimar qué tan bien habría funcionado una política nueva usando solo los datos que ya se registraron con la política vieja, sin haberla corrido de verdad."}, {"termino": "Qini / AUUC", "definicion": "Mide si un ranking de a quién contactar identifica bien a quienes el contacto de verdad cambia de decisión, usando un grupo de control aleatorio como referencia."}, {"termino": "Sandbox sintético", "definicion": "Todos los datos de este informe, salvo donde se cita la Ficha 165, son generados por un simulador, no de afiliados reales."}, {"termino": "Sleeping dog", "definicion": "Alguien a quien contactar empeora las cosas: sin el contacto se habría quedado, y el contacto lo hace irse."}, {"termino": "Uplift / efecto causal", "definicion": "El cambio que provoca de verdad una acción (como un contacto), distinto del riesgo que ya tenía la persona antes de la acción."}, {"termino": "WAPE", "definicion": "Error relativo de una proyección de montos, robusto a los ceros (a diferencia del MAPE). 0 es perfecto; 1 significa un error del mismo tamaño que el propio monto."}], "footer": {"pct_sintetico": "100"}}</script>
<script>
(function(){
  'use strict';
  var dataEl = document.getElementById('app-data');
  var DATA = JSON.parse(dataEl.textContent);

  var SCREENS = [
    {id:'inicio', label:'Inicio'},
    {id:'casos', label:'Casos'},
    {id:'torre-control', label:'Torre'},
    {id:'roadmap', label:'Roadmap'},
    {id:'datos-limites', label:'Datos'},
    {id:'anexo', label:'Anexo'},
    {id:'glosario', label:'Glosario'}
  ];

  var state = {screen:'inicio', caseSlug:null, tab:'problema', areaFilter:null, search:''};

  function lsGet(key, fallback){
    try { var v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch(e){ return fallback; }
  }
  function lsSet(key, val){ try { localStorage.setItem(key, val); } catch(e){} }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function caseSlug(c){
    if (c.numero && c.numero !== '—') return c.numero;
    return c.id === 'planilla' ? 'planilla' : 'correccion-01';
  }
  function findCase(slug){
    for (var i=0;i<DATA.casos.length;i++){ if (caseSlug(DATA.casos[i]) === slug) return DATA.casos[i]; }
    return null;
  }

  function parseHash(){
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/').filter(function(x){return x.length>0;});
    if (!parts.length) return null;
    var out = {screen:parts[0], caseSlug:null, tab:'problema'};
    if (out.screen === 'casos' && parts[1]){
      out.caseSlug = decodeURIComponent(parts[1]);
      if (parts[2]) out.tab = parts[2];
    }
    return out;
  }

  function setHash(screen, slug, tab){
    var h = '#/' + screen;
    if (slug) h += '/' + encodeURIComponent(slug);
    if (slug && tab) h += '/' + tab;
    if (location.hash !== h) location.hash = h; else { syncFromHash(); render(); }
  }

  function syncFromHash(){
    var parsed = parseHash();
    if (!parsed){
      var last = lsGet('cuprum_screen', 'inicio');
      state.screen = last; state.caseSlug = null; state.tab = 'problema';
      history.replaceState(null, '', '#/' + last);
      return;
    }
    state.screen = parsed.screen;
    state.caseSlug = parsed.caseSlug;
    state.tab = parsed.tab || 'problema';
  }

  function chipClass(nivel){
    if (nivel === 'ok') return 'chip-ok';
    if (nivel === 'reserva') return 'chip-warn';
    if (nivel === 'critico') return 'chip-critical';
    return 'chip-info';
  }
  function chipHtml(text, nivel){
    return '<span class="chip ' + chipClass(nivel) + '"><span class="chip-dot" aria-hidden="true"></span>' + esc(text) + '</span>';
  }
  function sevLabel(sev){ return sev === 'critical' ? 'crítico' : (sev === 'warn' ? 'atención' : 'ok'); }
  function stripeHtml(sev){
    var cls = sev === 'critical' ? 'stripe-critical' : (sev === 'warn' ? 'stripe-warn' : 'stripe-ok');
    return '<span class="stripe ' + cls + '" aria-hidden="true"></span>';
  }
  function sevChip(sev){
    var cls = sev === 'critical' ? 'chip-critical' : (sev === 'warn' ? 'chip-warn' : 'chip-ok');
    return '<span class="chip ' + cls + '"><span class="chip-dot" aria-hidden="true"></span>' + sevLabel(sev) + '</span>';
  }

  function renderInicio(){
    var el = document.getElementById('screen-inicio');
    var kpisHtml = DATA.kpis.map(function(k){
      return '<div class="kpi-card"><div class="kpi-num">' + k.valor + '</div>' +
        '<div class="kpi-spark">' + (k.spark || '') + '</div>' +
        '<div class="kpi-label">' + esc(k.label) + '</div>' +
        (k.sub ? '<div class="kpi-sub">' + esc(k.sub) + '</div>' : '') + '</div>';
    }).join('');
    var msgHtml = DATA.mensajes.map(function(m){ return '<li>' + m + '</li>'; }).join('');
    var capHtml = DATA.capacidades.map(function(c){
      return '<div class="cap-card"><h4>' + esc(c.titulo) + '</h4><p class="cap-sub">' + esc(c.sub) +
        '</p><p class="cap-desc">' + c.desc + '</p></div>';
    }).join('');
    var porArea = {};
    DATA.casos.forEach(function(c){ if (!porArea[c.area]) porArea[c.area] = c; });
    var accesos = DATA.areas.map(function(a){
      var c = porArea[a];
      if (!c) return '';
      return '<a class="acceso-card" href="#/casos/' + caseSlug(c) + '">' +
        '<span class="acceso-area">' + esc(a) + '</span>' +
        '<span class="acceso-titulo">' + esc(c.titulo) + '</span>' +
        '<span class="acceso-metrica mono">' + esc(c.metrica_principal) + '</span></a>';
    }).join('');
    el.innerHTML =
      '<h1>Qué ofrece Data Analytics a AFP Cuprum</h1>' +
      '<p class="medida">Portafolio navegable por pantallas: mismo contenido y las mismas cifras que el informe completo.</p>' +
      '<h2>Cinco números</h2><div class="kpi-grid cinco">' + kpisHtml + '</div>' +
      '<h2>Cinco mensajes</h2><ul class="mensajes medida">' + msgHtml + '</ul>' +
      '<h2>Accesos directos por área</h2><div class="accesos-grid">' + accesos + '</div>' +
      '<h2>Qué ofrece el equipo</h2><div class="grid-cap">' + capHtml + '</div>' +
      '<div class="chart-wrap"><figure>' + DATA.construccion.chart_densidad +
      '<figcaption>' + esc(DATA.construccion.chart_caption) + '</figcaption></figure></div>';
  }

  function matchesFilter(c){
    if (state.areaFilter && c.area !== state.areaFilter) return false;
    if (state.search){
      var q = state.search.toLowerCase();
      var hay = (c.titulo + ' ' + c.nombre + ' ' + c.numero + ' ' + c.area).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }
  function renderCasosGrid(){
    var grid = document.getElementById('casos-grid');
    if (!grid) return;
    var list = DATA.casos.filter(matchesFilter);
    var html = list.map(function(c){
      return '<a class="caso-card" href="#/casos/' + caseSlug(c) + '">' +
        '<div class="caso-card-head"><span class="badge badge-accent">' + esc(c.numero) + '</span>' +
        chipHtml(c.estado_texto, c.estado_nivel) + '</div>' +
        '<h3>' + esc(c.titulo) + '</h3>' +
        '<p class="caso-card-area">' + esc(c.area) + ' &middot; ' + esc(c.nombre) + '</p>' +
        '<p class="caso-card-metrica mono">' + esc(c.metrica_principal) + '</p>' +
        '<p class="caso-card-reserva">' + esc(c.reserva_corta) + '</p></a>';
    }).join('');
    grid.innerHTML = html || '<p class="medida">Ningún caso coincide con el filtro.</p>';
  }
  var TABS = [
    {id:'problema', label:'Problema'}, {id:'resultado', label:'Resultado'},
    {id:'dashboard', label:'Dashboard'}, {id:'produccion', label:'Producción'},
    {id:'reserva', label:'Reserva'}, {id:'fuente', label:'Fuente'}
  ];
  function tabContent(c, tab){
    if (tab === 'problema') return '<div class="medida">' + c.problema_html + '</div>';
    if (tab === 'resultado') return '<div class="medida">' + c.resultado_html + '<h4>Cómo lo usaría el área</h4>' + c.uso_html + '</div>';
    if (tab === 'dashboard') return c.dashboard_html;
    if (tab === 'produccion') return '<div class="medida">' + c.produccion_html + '</div>';
    if (tab === 'reserva') return c.reserva_html;
    if (tab === 'fuente') return '<p class="fuente-cita">Fuente: ' + esc(c.fuente_texto) + '</p>';
    return '';
  }
  function renderDetalle(){
    var det = document.getElementById('caso-detalle');
    var grid = document.getElementById('casos-grid');
    if (!det || !grid) return;
    var c = findCase(state.caseSlug);
    if (!c){ det.hidden = true; grid.hidden = false; det.innerHTML=''; return; }
    grid.hidden = true; det.hidden = false;
    var idx = DATA.casos.indexOf(c);
    var prev = DATA.casos[(idx - 1 + DATA.casos.length) % DATA.casos.length];
    var next = DATA.casos[(idx + 1) % DATA.casos.length];
    var tabsHtml = TABS.map(function(t){
      var sel = (t.id === state.tab);
      return '<button class="detalle-tab" role="tab" aria-selected="' + sel + '" data-tab="' + t.id +
        '" id="tab-' + t.id + '">' + t.label + '</button>';
    }).join('');
    det.innerHTML =
      '<div class="detalle-head"><button class="btn-icon" id="btn-cerrar-detalle" aria-label="Cerrar y volver a la grilla">&times;</button>' +
      '<span class="badge badge-accent">' + esc(c.numero) + '</span><h3>' + esc(c.titulo) + '</h3>' +
      '<span class="badge">' + esc(c.nombre) + '</span>' + chipHtml(c.estado_texto, c.estado_nivel) + '</div>' +
      '<div class="detalle-tabs" role="tablist">' + tabsHtml + '</div>' +
      '<div class="detalle-body" id="detalle-body" role="tabpanel">' + tabContent(c, state.tab) + '</div>' +
      '<div class="detalle-nav"><a href="#/casos/' + caseSlug(prev) + '/' + state.tab + '" class="btn-nav">&larr; ' +
      esc(prev.numero) + ' ' + esc(prev.nombre) + '</a><a href="#/casos/' + caseSlug(next) + '/' + state.tab +
      '" class="btn-nav">' + esc(next.numero) + ' ' + esc(next.nombre) + ' &rarr;</a></div>';
    var tabButtons = det.querySelectorAll('.detalle-tab');
    for (var i=0;i<tabButtons.length;i++){
      tabButtons[i].addEventListener('click', (function(btn){
        return function(){ setHash('casos', state.caseSlug, btn.getAttribute('data-tab')); };
      })(tabButtons[i]));
    }
    var closeBtn = document.getElementById('btn-cerrar-detalle');
    if (closeBtn) closeBtn.addEventListener('click', function(){ setHash('casos', null, null); });
    var focusTarget = document.getElementById('tab-' + state.tab);
    if (focusTarget) focusTarget.focus({preventScroll:true});
  }
  function renderCasos(){ renderCasosGrid(); renderDetalle(); }

  var torreState = {area:null, sev:null};
  function renderTorre(){
    var el = document.getElementById('screen-torre-control');
    var t = DATA.torre_control;
    var kpisHtml = t.kpis.map(function(k){
      return '<div class="md-kpi"><div class="md-kpi-num">' + k[0] + '</div><div class="md-kpi-label">' + esc(k[1]) + '</div></div>';
    }).join('');
    var areasChips = DATA.areas.map(function(a){
      return '<button class="chip-filter" data-area="' + esc(a) + '" aria-pressed="' + (torreState.area===a) + '">' + esc(a) + '</button>';
    }).join('');
    el.innerHTML =
      '<h2>Torre de control: los casos en un solo tablero</h2>' +
      '<p class="medida">Vista integrada de las capacidades de priorización, con alertas filtrables por área y severidad.</p>' +
      '<div class="mockup"><div class="mockup-bar"><span class="mockup-dot"></span><span class="mockup-dot"></span>' +
      '<span class="mockup-dot"></span><span class="mockup-title">Torre de control &middot; portafolio Cuprum</span></div>' +
      '<div class="mockup-body"><div class="md-kpis">' + kpisHtml + '</div>' +
      '<div class="torre-filtros"><span class="filtro-label">Área</span>' +
      '<button class="chip-filter" data-area="" aria-pressed="' + (torreState.area===null) + '">Todas</button>' + areasChips +
      '<span class="filtro-label">Severidad</span><select id="torre-sev">' +
      '<option value="">Todas</option><option value="critical">Crítico</option><option value="warn">Atención</option>' +
      '<option value="ok">Ok</option></select></div>' +
      '<div class="md-table-wrap"><table class="md-table"><thead><tr><th>Área</th><th>Alerta</th><th>Detalle</th>' +
      '<th>Valor</th><th>Estado</th></tr></thead><tbody id="torre-tbody"></tbody></table></div>' +
      '<div class="md-chart"><figure>' + t.chart_svg + '<figcaption>' + esc(t.chart_caption) + '</figcaption></figure></div>' +
      '</div></div>';
    var chipButtons = el.querySelectorAll('.chip-filter');
    for (var i=0;i<chipButtons.length;i++){
      chipButtons[i].addEventListener('click', (function(b){
        return function(){
          torreState.area = b.getAttribute('data-area') || null;
          for (var j=0;j<chipButtons.length;j++){ chipButtons[j].setAttribute('aria-pressed', String(chipButtons[j]===b)); }
          renderTorreTable();
        };
      })(chipButtons[i]));
    }
    var sevSel = document.getElementById('torre-sev');
    if (sevSel) sevSel.addEventListener('change', function(e){ torreState.sev = e.target.value || null; renderTorreTable(); });
    renderTorreTable();
  }
  function renderTorreTable(){
    var t = DATA.torre_control;
    var rows = t.filas.filter(function(f){
      if (torreState.area && f.area !== torreState.area) return false;
      if (torreState.sev && f.severidad !== torreState.sev) return false;
      return true;
    });
    var body = document.getElementById('torre-tbody');
    if (!body) return;
    var html = rows.map(function(f){
      return '<tr class="sev-' + f.severidad + '"><td>' + esc(f.area) + '</td><td>' + stripeHtml(f.severidad) +
        esc(f.alerta) + '</td><td>' + esc(f.detalle) + '</td><td class="num">' + esc(f.valor) + '</td><td>' +
        sevChip(f.severidad) + '</td></tr>';
    }).join('');
    body.innerHTML = html || '<tr><td colspan="5">Sin alertas para este filtro.</td></tr>';
  }

  function renderRoadmap(){
    var el = document.getElementById('screen-roadmap');
    var items = DATA.roadmap.map(function(p){
      return '<li><h4>' + esc(p.titulo) + '</h4><p>' + p.desc + '</p><p class="roadmap-pide"><strong>Se pide al negocio:</strong> ' + p.pide + '</p></li>';
    }).join('');
    el.innerHTML = '<h2>Roadmap</h2><p class="medida">En este orden porque cada paso reduce el riesgo del siguiente. ' +
      'Es la única pantalla con pasos numerados.</p><ol class="roadmap medida">' + items + '</ol>';
  }

  function renderDatos(){
    var el = document.getElementById('screen-datos-limites');
    var s = DATA.supuestos;
    var datosHtml = s.datos.map(function(x){ return '<li>' + x + '</li>'; }).join('');
    var modelosHtml = s.modelos.map(function(x){ return '<li>' + x + '</li>'; }).join('');
    el.innerHTML = '<h2>Supuestos, reservas y límites</h2><p class="medida">' + s.intro + '</p>' +
      '<h3>Sobre los datos</h3><ul class="medida">' + datosHtml + '</ul>' +
      '<h3>Sobre los modelos</h3><ul class="medida">' + modelosHtml + '</ul>';
  }

  var anexoSort = {col:null, dir:1};
  var ANEXO_COLS = ['proyecto','datos','modelo','metrica','tests','runtime','revision'];
  var ANEXO_LABELS = {proyecto:'Proyecto', datos:'Datos', modelo:'Modelo', metrica:'Métrica principal', tests:'Tests', runtime:'Runtime', revision:'Revisión'};
  function renderAnexo(){
    var el = document.getElementById('screen-anexo');
    var head = ANEXO_COLS.map(function(c){
      var sortDir = anexoSort.col===c ? (anexoSort.dir>0 ? 'ascending' : 'descending') : 'none';
      return '<th data-col="' + c + '" aria-sort="' + sortDir + '" tabindex="0" role="button">' + ANEXO_LABELS[c] + '</th>';
    }).join('');
    el.innerHTML = '<h2>Anexo técnico</h2><p class="medida">Una fila por proyecto. Pulsa un encabezado (o Enter) para ordenar.</p>' +
      '<div class="tabla-wrap"><table class="tabla sortable"><thead><tr>' + head + '</tr></thead><tbody id="anexo-tbody"></tbody></table></div>';
    var ths = el.querySelectorAll('th');
    for (var i=0;i<ths.length;i++){
      (function(th){
        function toggle(){
          var col = th.getAttribute('data-col');
          if (anexoSort.col === col) anexoSort.dir *= -1; else { anexoSort.col = col; anexoSort.dir = 1; }
          renderAnexo();
        }
        th.addEventListener('click', toggle);
        th.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
      })(ths[i]);
    }
    renderAnexoRows();
  }
  function renderAnexoRows(){
    var rows = DATA.anexo.slice();
    if (anexoSort.col){
      rows.sort(function(a,b){
        var av = a[anexoSort.col], bv = b[anexoSort.col];
        return (av > bv ? 1 : (av < bv ? -1 : 0)) * anexoSort.dir;
      });
    }
    var body = document.getElementById('anexo-tbody');
    if (!body) return;
    body.innerHTML = rows.map(function(r){
      return '<tr><td>' + esc(r.proyecto) + '</td><td>' + esc(r.datos) + '</td><td>' + esc(r.modelo) + '</td>' +
        '<td class="num">' + esc(r.metrica) + '</td><td class="num">' + esc(r.tests) + '</td><td class="num">' +
        esc(r.runtime) + '</td><td>' + esc(r.revision) + '</td></tr>';
    }).join('');
  }

  function renderGlosario(){
    var el = document.getElementById('screen-glosario');
    el.innerHTML = '<h2>Glosario</h2>' +
      '<input type="search" id="glosario-buscador" class="buscador" placeholder="Buscar termino" aria-label="Buscar en el glosario">' +
      '<dl class="glosario medida" id="glosario-lista"></dl>';
    var input = document.getElementById('glosario-buscador');
    input.addEventListener('input', function(e){ renderGlosarioLista(e.target.value); });
    renderGlosarioLista('');
  }
  function renderGlosarioLista(q){
    q = (q || '').toLowerCase();
    var items = DATA.glosario.filter(function(g){
      return !q || g.termino.toLowerCase().indexOf(q) > -1 || g.definicion.toLowerCase().indexOf(q) > -1;
    });
    var el = document.getElementById('glosario-lista');
    if (!el) return;
    el.innerHTML = items.map(function(g){ return '<dt>' + esc(g.termino) + '</dt><dd>' + esc(g.definicion) + '</dd>'; }).join('') ||
      '<p class="medida">Sin coincidencias.</p>';
  }

  function renderChromeState(){
    var navLinks = document.querySelectorAll('[data-nav-screen]');
    for (var i=0;i<navLinks.length;i++){
      var active = navLinks[i].getAttribute('data-nav-screen') === state.screen;
      navLinks[i].setAttribute('aria-current', active ? 'page' : 'false');
    }
    var chips = document.querySelectorAll('.topbar-chip');
    for (var j=0;j<chips.length;j++){
      var area = chips[j].getAttribute('data-area') || null;
      chips[j].setAttribute('aria-pressed', String(area === state.areaFilter));
    }
  }

  var RENDERERS = {
    'inicio':renderInicio, 'casos':renderCasos, 'torre-control':renderTorre,
    'roadmap':renderRoadmap, 'datos-limites':renderDatos, 'anexo':renderAnexo, 'glosario':renderGlosario
  };
  function render(){
    var screen = RENDERERS[state.screen] ? state.screen : 'inicio';
    for (var i=0;i<SCREENS.length;i++){
      var el = document.getElementById('screen-' + SCREENS[i].id);
      if (el) el.hidden = (SCREENS[i].id !== screen);
    }
    RENDERERS[screen]();
    renderChromeState();
    lsSet('cuprum_screen', screen);
    lsSet('cuprum_area', state.areaFilter || '');
  }

  window.addEventListener('hashchange', function(){ syncFromHash(); render(); });

  document.addEventListener('click', function(e){
    var chip = e.target.closest ? e.target.closest('.topbar-chip') : null;
    if (chip){
      var area = chip.getAttribute('data-area') || null;
      state.areaFilter = (state.areaFilter === area) ? null : area;
      renderChromeState();
      if (state.screen === 'casos') renderCasosGrid();
      if (state.screen === 'inicio') renderInicio();
    }
  });

  var searchEl = document.getElementById('topbar-search');
  if (searchEl){
    searchEl.addEventListener('input', function(e){
      state.search = e.target.value;
      if (state.screen === 'casos') renderCasosGrid();
    });
  }

  document.addEventListener('keydown', function(e){
    if (state.screen === 'casos' && state.caseSlug){
      if (e.key === 'Escape'){ e.preventDefault(); setHash('casos', null, null); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
        var c = findCase(state.caseSlug);
        if (!c) return;
        var idx = DATA.casos.indexOf(c);
        var dir = (e.key === 'ArrowRight') ? 1 : -1;
        var nextC = DATA.casos[(idx + dir + DATA.casos.length) % DATA.casos.length];
        e.preventDefault();
        setHash('casos', caseSlug(nextC), state.tab);
      }
    }
  });

  syncFromHash();
  state.areaFilter = lsGet('cuprum_area', '') || null;
  render();
})();
</script>
</body>
</html>
