[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afp-analytics-lab"
version = "0.1.0"
description = "Sandbox de modelos analiticos para una AFP con datos sinteticos"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyspark>=4.0,<5",
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["afp_lab*"]

[tool.pytest.ini_options]
testpaths = ["afp_lab"]
